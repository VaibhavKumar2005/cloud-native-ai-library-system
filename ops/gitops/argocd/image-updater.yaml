###############################################################################
# Argo CD Image Updater — Automatic Image Tag Promotion
#
# This annotation-based config tells Argo CD Image Updater to:
#   1. Poll ACR for new image tags matching the semver/digest pattern
#   2. Automatically update the Helm values with the new tag
#   3. Commit the change back to the manifests repository
#
# Install: kubectl apply -n argocd -f \
#   https://raw.githubusercontent.com/argoproj-labs/argocd-image-updater/stable/manifests/install.yaml
#
# The annotations below are applied to the main Application manifest.
# This file documents the configuration separately for clarity.
###############################################################################

# ── Step 1: Configure ACR credentials in Argo CD ───────────────────────────
# kubectl -n argocd create secret docker-registry acr-credentials \
#   --docker-server=acrvaibhavrag2026.azurecr.io \
#   --docker-username=$ACR_USERNAME \
#   --docker-password=$ACR_PASSWORD

# ── Step 2: Register the ACR in Argo CD Image Updater config ───────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd-image-updater
data:
  registries.conf: |
    registries:
      - name: ACR
        api_url: https://acrvaibhavrag2026.azurecr.io
        prefix: acrvaibhavrag2026.azurecr.io
        credentials: secret:argocd/acr-credentials#.dockerconfigjson
        defaultns: library
        default: true

---
# ── Step 3: Annotated Application (patched version of the main app) ────────
# Apply these annotations to the verirag Application resource.
# They instruct Image Updater what to watch and how to update.
#
# In practice, merge these annotations into gitops/argocd/application.yaml:
#
#   metadata:
#     annotations:
#       argocd-image-updater.argoproj.io/image-list: >
#         backend=acrvaibhavrag2026.azurecr.io/verirag-backend,
#         frontend=acrvaibhavrag2026.azurecr.io/verirag-frontend
#       argocd-image-updater.argoproj.io/backend.update-strategy: latest
#       argocd-image-updater.argoproj.io/frontend.update-strategy: latest
#       argocd-image-updater.argoproj.io/backend.helm.image-name: backend.image.repository
#       argocd-image-updater.argoproj.io/backend.helm.image-tag: backend.image.tag
#       argocd-image-updater.argoproj.io/frontend.helm.image-name: frontend.image.repository
#       argocd-image-updater.argoproj.io/frontend.helm.image-tag: frontend.image.tag
#       argocd-image-updater.argoproj.io/write-back-method: git
#       argocd-image-updater.argoproj.io/write-back-target: kustomization
#       argocd-image-updater.argoproj.io/git-branch: main

# ── How It Works (End-to-End Flow) ─────────────────────────────────────────
#
#  ┌──────────────┐    ┌──────────────────┐    ┌───────────────────┐
#  │  Developer    │───▶│  GitHub Actions   │───▶│  Azure Container  │
#  │  pushes code  │    │  builds & pushes  │    │  Registry (ACR)   │
#  └──────────────┘    └──────────────────┘    └───────┬───────────┘
#                                                       │
#                                         ┌─────────────▼─────────────┐
#                                         │  Argo CD Image Updater    │
#                                         │  polls ACR every 2 min    │
#                                         │  detects new tag           │
#                                         └─────────────┬─────────────┘
#                                                       │
#                                         ┌─────────────▼─────────────┐
#                                         │  Commits new tag to       │
#                                         │  verirag-k8s-manifests    │
#                                         │  repository (Git)         │
#                                         └─────────────┬─────────────┘
#                                                       │
#                                         ┌─────────────▼─────────────┐
#                                         │  Argo CD detects Git diff │
#                                         │  Auto-syncs deployments   │
#                                         │  Rolling update begins    │
#                                         └───────────────────────────┘
