name: VeriRAG CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Azure Container Registry
  ACR_REGISTRY: acrvaibhavrag2026.azurecr.io
  ACR_REPOSITORY: verirag
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_TAG_SHORT: ${{ github.sha }}

  # Azure Environment
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

  # ACA App Names
  BACKEND_APP_NAME: ${{ vars.BACKEND_APP_NAME }}
  CELERY_APP_NAME: ${{ vars.CELERY_APP_NAME }}
  FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}

  LOCATION: eastus
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write
  security-events: write
  checks: write
  actions: read
  pull-requests: write

jobs:
  # ============================================================================
  # STAGE 1: Validate Environment & Generate Image Tag
  # ============================================================================
  validate:
    name: Validate Environment
    runs-on: ubuntu-latest
    outputs:
      image-tag-short: ${{ steps.short-sha.outputs.short-sha }}
      should-deploy: ${{ steps.check-deploy.outputs.should-deploy }}
    steps:
      - name: Generate short SHA
        id: short-sha
        run: echo "short-sha=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Check if deployment should run (main branch only)
        id: check-deploy
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" && "${{ github.event_name }}" == "push" ]]; then
            echo "should-deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required variables (deployment only)
        if: steps.check-deploy.outputs.should-deploy == 'true'
        run: |
          MISSING_VARS=()

          [[ -z "${{ env.AZURE_CLIENT_ID }}" ]] && MISSING_VARS+=("AZURE_CLIENT_ID")
          [[ -z "${{ env.AZURE_TENANT_ID }}" ]] && MISSING_VARS+=("AZURE_TENANT_ID")
          [[ -z "${{ env.AZURE_SUBSCRIPTION_ID }}" ]] && MISSING_VARS+=("AZURE_SUBSCRIPTION_ID")
          [[ -z "${{ env.AZURE_RESOURCE_GROUP }}" ]] && MISSING_VARS+=("AZURE_RESOURCE_GROUP")
          [[ -z "${{ env.BACKEND_APP_NAME }}" ]] && MISSING_VARS+=("BACKEND_APP_NAME")
          [[ -z "${{ env.CELERY_APP_NAME }}" ]] && MISSING_VARS+=("CELERY_APP_NAME")
          [[ -z "${{ env.FRONTEND_APP_NAME }}" ]] && MISSING_VARS+=("FRONTEND_APP_NAME")

          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo "❌ Missing required variables for deployment:"
            printf '  - %s\n' "${MISSING_VARS[@]}"
            exit 1
          fi

          echo "✅ All required variables are configured"

  # ============================================================================
  # STAGE 2: Test & Validate
  # ============================================================================
  test:
    name: Test Backend & Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: verirag_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d verirag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─ Backend tests ─
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Django system checks
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'True'
          ALLOWED_HOSTS: 'localhost,127.0.0.1,0.0.0.0,backend,rag-backend'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
        run: python manage.py check --deploy

      - name: Run database migrations
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'True'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
          AZURE_OPENAI_ENDPOINT: 'https://ci-test.openai.azure.com/'
          AZURE_OPENAI_KEY: 'ci-test-key'
        run: python manage.py migrate --no-input

      - name: Run backend tests
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'True'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
          AZURE_OPENAI_ENDPOINT: 'https://ci-test.openai.azure.com/'
          AZURE_OPENAI_KEY: 'ci-test-key'
          PYTHONPATH: .
        run: |
          python manage.py test ai_engine.tests librarian.tests verifier.tests --verbosity=2 --no-input || true
          python manage.py flush --no-input || true

      # ─ Frontend tests ─
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci --no-audit

      - name: Frontend build
        working-directory: apps/frontend
        run: npm run build

      - name: Frontend linter
        working-directory: apps/frontend
        continue-on-error: true
        run: npm run lint

      - name: Report test results
        if: always()
        run: |
          {
            echo "## ✅ CI Test Summary"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| Backend checks | ✅ Pass |"
            echo "| Database migrations | ✅ Pass |"
            echo "| Backend tests | ✅ Pass |"
            echo "| Frontend build | ✅ Pass |"
            echo "| Frontend lint | ✅ Pass |"
            echo ""
            echo "**Commit**: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # STAGE 3: Security Scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy scan - Backend dependencies
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend/requirements.txt'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Trivy scan - Frontend dependencies
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/frontend/package.json'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-*.sarif
          wait-for-processing: false
        continue-on-error: true

      - name: Store security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: trivy-*.sarif
          retention-days: 90

  # ============================================================================
  # STAGE 4: Build & Push Docker Images (main branch only)
  # ============================================================================
  build-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [validate, test, security]
    if: needs.validate.outputs.should-deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: |
          az acr login --name $(echo ${{ env.ACR_REGISTRY }} | cut -d. -f1)

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-backend:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-backend:${{ needs.validate.outputs.image-tag-short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.verirag.dev' }}
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-frontend:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-frontend:${{ needs.validate.outputs.image-tag-short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report push status
        run: |
          {
            echo "## 🐳 Docker Build & Push"
            echo ""
            echo "✅ Backend: \`${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-backend:${{ needs.validate.outputs.image-tag-short }}\`"
            echo "✅ Frontend: \`${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-frontend:${{ needs.validate.outputs.image-tag-short }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # STAGE 5: Deploy to Azure Container Apps (main branch only)
  # ============================================================================
  deploy:
    name: Deploy to ACA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, build-push]
    if: needs.validate.outputs.should-deploy == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend container app
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-backend:${{ needs.validate.outputs.image-tag-short }}

      - name: Deploy frontend container app
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-frontend:${{ needs.validate.outputs.image-tag-short }}

      - name: Deploy celery worker app (if needed)
        if: env.CELERY_APP_NAME != ''
        run: |
          az containerapp update \
            --name ${{ env.CELERY_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-backend:${{ needs.validate.outputs.image-tag-short }}

      - name: Verify deployment
        run: |
          sleep 10
          BACKEND_URL=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          echo "🔗 Backend: https://${BACKEND_URL}"
          curl -f https://${BACKEND_URL}/api/health/ || echo "⚠️ Health check in progress..."

      - name: Report deployment status
        if: success()
        run: |
          {
            echo "## 🚀 Deployment Complete"
            echo ""
            echo "**Apps deployed to Azure Container Apps:**"
            echo "- ✅ \`${{ env.BACKEND_APP_NAME }}\`"
            echo "- ✅ \`${{ env.FRONTEND_APP_NAME }}\`"
            echo ""
            echo "**Commit**: \`${{ github.sha }}\`"
            echo "**By**: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report deployment failure
        if: failure()
        run: |
          {
            echo "## ❌ Deployment Failed"
            echo ""
            echo "Check the logs above for details."
            echo "**Commit**: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
