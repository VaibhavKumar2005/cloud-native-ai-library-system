apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "verirag.fullname" . }}-config
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "verirag.labels" . | nindent 4 }}
data:
  DEPLOY_MODE: {{ .Values.global.deployMode | default "local" | quote }}
  DJANGO_SETTINGS_MODULE: {{ .Values.backend.env.DJANGO_SETTINGS_MODULE | default "rag_backend.settings" | quote }}
  DEBUG: {{ .Values.backend.env.DEBUG | default "False" | quote }}
  ALLOWED_HOSTS: {{ .Values.backend.env.ALLOWED_HOSTS | default "localhost" | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.backend.env.CORS_ALLOWED_ORIGINS | default "" | quote }}
  POSTGRES_HOST: {{ include "verirag.pgHost" . | quote }}
  POSTGRES_DB: {{ .Values.postgresql.auth.database | default "verirag_db" | quote }}
  POSTGRES_PORT: "5432"
  REDIS_URL: {{ include "verirag.redisUrl" . | quote }}
  CELERY_BROKER_URL: {{ include "verirag.redisUrl" . | quote }}
  CELERY_RESULT_BACKEND: {{ include "verirag.redisUrl" . | quote }}
  {{- if .Values.vault.enabled }}
  VAULT_ADDR: {{ include "verirag.vaultAddr" . | quote }}
  {{- end }}
  {{- if and (not .Values.vault.enabled) .Values.vault.azureKeyVaultUrl }}
  AZURE_KEY_VAULT_URL: {{ .Values.vault.azureKeyVaultUrl | quote }}
  {{- end }}
