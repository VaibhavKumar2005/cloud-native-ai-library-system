###############################################################################
# VeriRAG Helm Values — LOCAL MODE (Kind / Minikube)
#
# Uses containerized Vault, Redis, and PostgreSQL.
# Override with values-production.yaml for Azure managed services.
###############################################################################

# ── Global ─────────────────────────────────────────────────────────────────
global:
  deployMode: local   # "local" or "cloud"
  namespace: verirag
  imagePullPolicy: IfNotPresent

# ── Backend (Django REST API) ──────────────────────────────────────────────
backend:
  replicaCount: 2
  image:
    repository: acrvaibhavrag2026.azurecr.io/verirag-backend
    tag: "latest"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8000
  env:
    DJANGO_SETTINGS_MODULE: "rag_backend.settings"
    DEBUG: "False"
    DEPLOY_MODE: "local"
    ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,rag-backend,rag-backend.verirag.svc.cluster.local"
    CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:30080"

# ── Frontend (React SPA via Nginx) ────────────────────────────────────────
frontend:
  enabled: true
  replicaCount: 1
  image:
    repository: acrvaibhavrag2026.azurecr.io/verirag-frontend
    tag: "latest"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  service:
    type: NodePort
    port: 8080
    nodePort: 30081

# ── Celery Worker ──────────────────────────────────────────────────────────
celeryWorker:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  queues: "celery,ingestion,monitoring,maintenance"

# ── Celery Beat ────────────────────────────────────────────────────────────
celeryBeat:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ── PostgreSQL (Local Mode — containerized) ────────────────────────────────
postgresql:
  enabled: true          # Set false in cloud mode (use managed service)
  image: pgvector/pgvector:pg16
  storage: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  auth:
    database: verirag_db
    # Credentials come from K8s Secret (verirag-secrets)

# ── Redis (Local Mode — containerized) ─────────────────────────────────────
redis:
  enabled: true          # Set false in cloud mode (use Azure Cache for Redis)
  image: redis:7-alpine
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  connectionUrl: "redis://rag-redis:6379/0"

# ── HashiCorp Vault (Local Mode — dev server) ─────────────────────────────
vault:
  enabled: true          # Set false in cloud mode (use Azure Key Vault)
  image: vault:1.13.3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  addr: "http://rag-vault:8200"

# ── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: nginx
  host: verirag.local
  tls: false

# ── HPA (Horizontal Pod Autoscaler) ───────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

# ── KEDA Scaled Object (Redis queue-based scaling) ─────────────────────────
keda:
  enabled: false         # Enable in cloud mode for scale-to-zero
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 5
  listLength: "5"

# ── Service Account ───────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: verirag-sa
  annotations: {}

# ── Pod Security Context (AZ-400 compliance) ──────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # Django needs /tmp
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# ── Secrets (MUST be overridden at install time — never commit real values) ─
# Usage: helm install verirag ./helm/verirag \
#   --set secrets.postgresPassword=xxx --set secrets.djangoSecretKey=xxx --set secrets.vaultToken=xxx
secrets:
  postgresUser: admin
  postgresPassword: ""    # REQUIRED — helm will fail if empty
  djangoSecretKey: ""     # REQUIRED — generate with: python -c "import secrets; print(secrets.token_urlsafe(50))"
  vaultToken: ""          # REQUIRED in local mode

# ── External Secrets (disabled in local mode) ──────────────────────────────
externalSecrets:
  enabled: false

