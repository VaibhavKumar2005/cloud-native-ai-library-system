{{- if .Values.vault.enabled }}
# ── HashiCorp Vault (Dev Server — Local Mode Only) ─────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "verirag.fullname" . }}-vault
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "verirag.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "verirag.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vault
  template:
    metadata:
      labels:
        {{- include "verirag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vault
    spec:
      containers:
        - name: vault
          image: {{ .Values.vault.image | default "vault:1.13.3" }}
          ports:
            - containerPort: 8200
              name: vault
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "verirag.fullname" . }}-secrets
                  key: VAULT_TOKEN
            - name: VAULT_DEV_LISTEN_ADDRESS
              value: "0.0.0.0:8200"
          # Vault dev server requires IPC_LOCK — allowed via seccomp, not privileged
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.vault.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: vault
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/sys/health
              port: vault
            initialDelaySeconds: 15
            periodSeconds: 20
---
# ── Vault Service ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ include "verirag.fullname" . }}-vault
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "verirag.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
spec:
  type: ClusterIP
  ports:
    - port: 8200
      targetPort: vault
      name: vault
  selector:
    {{- include "verirag.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vault
{{- end }}
