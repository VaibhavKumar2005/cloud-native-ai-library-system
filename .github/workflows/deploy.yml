name: Deploy

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to deploy'
        required: true
        default: 'main'
      image_tag:
        description: 'ACR image tag to deploy (for both backend/frontend)'
        required: true
        default: 'latest'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aca-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.git_ref }}

      - name: Azure login (Workload Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure latest Azure CLI containerapp extension
        run: |
          az extension add --name containerapp --upgrade

      - name: Validate required vars and secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ vars.AZURE_RESOURCE_GROUP }}" ]] || { echo "Missing repo variable: AZURE_RESOURCE_GROUP"; exit 1; }
          [[ -n "${{ vars.BACKEND_APP_NAME }}" ]] || { echo "Missing repo variable: BACKEND_APP_NAME"; exit 1; }
          [[ -n "${{ vars.FRONTEND_APP_NAME }}" ]] || { echo "Missing repo variable: FRONTEND_APP_NAME"; exit 1; }
          [[ -n "${{ vars.ACR_LOGIN_SERVER || vars.ACR_NAME }}" ]] || { echo "Missing repo variable: set ACR_LOGIN_SERVER or ACR_NAME"; exit 1; }
          [[ -n "${{ secrets.PG_ADMIN_PASSWORD || secrets.POSTGRES_PASSWORD }}" ]] || { echo "Missing repo secret: set PG_ADMIN_PASSWORD or POSTGRES_PASSWORD"; exit 1; }
          [[ -n "${{ secrets.DJANGO_SECRET_KEY }}" ]] || { echo "Missing repo secret: DJANGO_SECRET_KEY"; exit 1; }

      - name: Setup Terraform
        if: ${{ vars.AZURE_RESOURCE_GROUP != '' }}
        uses: hashicorp/setup-terraform@v3

      - name: Detect existing infrastructure
        id: infra-check
        shell: bash
        run: |
          set -euo pipefail
          RG_EXISTS="$(az group exists --name "${{ vars.AZURE_RESOURCE_GROUP }}")"
          echo "rg_exists=$RG_EXISTS" >> "$GITHUB_OUTPUT"
          if [[ "$RG_EXISTS" == "true" ]]; then
            echo "Resource group exists. Skipping Terraform create/apply for this run."
          else
            echo "Resource group does not exist. Terraform will provision infrastructure."
          fi

      - name: Terraform Init
        if: ${{ steps.infra-check.outputs.rg_exists == 'false' }}
        working-directory: ops/infrastructure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
        run: terraform init -input=false

      - name: Terraform Plan
        if: ${{ steps.infra-check.outputs.rg_exists == 'false' }}
        working-directory: ops/infrastructure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          TF_VAR_pg_admin_password: ${{ secrets.PG_ADMIN_PASSWORD || secrets.POSTGRES_PASSWORD }}
          TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION || 'centralindia' }}
          TF_VAR_aca_env_location: ${{ vars.AZURE_LOCATION || 'centralindia' }}
          TF_VAR_acr_name: ${{ vars.ACR_NAME || 'acrvaibhavrag2026' }}
          TF_VAR_aca_env_name: ${{ vars.ACA_ENV_NAME || 'verirag-env' }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply (Create/Update Infra First)
        if: ${{ steps.infra-check.outputs.rg_exists == 'false' }}
        working-directory: ops/infrastructure
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          TF_VAR_pg_admin_password: ${{ secrets.PG_ADMIN_PASSWORD || secrets.POSTGRES_PASSWORD }}
          TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION || 'centralindia' }}
          TF_VAR_aca_env_location: ${{ vars.AZURE_LOCATION || 'centralindia' }}
          TF_VAR_acr_name: ${{ vars.ACR_NAME || 'acrvaibhavrag2026' }}
          TF_VAR_aca_env_name: ${{ vars.ACA_ENV_NAME || 'verirag-env' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Confirm ACA apps exist after Terraform
        shell: bash
        run: |
          set -euo pipefail
          az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.BACKEND_APP_NAME }}" >/dev/null
          az containerapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.FRONTEND_APP_NAME }}" >/dev/null

      - name: Resolve deploy image tag
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail
          ACR_NAME="${{ vars.ACR_NAME || 'acrvaibhavrag2026' }}"
          REQUESTED_TAG="${{ inputs.image_tag }}"
          BACKEND_REPO="verirag-backend"
          FRONTEND_REPO="verirag-frontend"

          backend_exists="$(az acr repository show-tags --name "$ACR_NAME" --repository "$BACKEND_REPO" --query "contains(@, '$REQUESTED_TAG')" -o tsv)"
          frontend_exists="$(az acr repository show-tags --name "$ACR_NAME" --repository "$FRONTEND_REPO" --query "contains(@, '$REQUESTED_TAG')" -o tsv)"

          if [[ "$backend_exists" == "true" && "$frontend_exists" == "true" ]]; then
            echo "Using requested tag: $REQUESTED_TAG"
            echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$REQUESTED_TAG" != "latest" ]]; then
            echo "Requested tag '$REQUESTED_TAG' not found in both repos. Falling back to 'latest'."
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "Tag 'latest' must exist in both $BACKEND_REPO and $FRONTEND_REPO but was not found."
            exit 1
          fi

      - name: Deploy backend
        run: |
          IMAGE_URI="${{ vars.ACR_LOGIN_SERVER || format('{0}.azurecr.io', vars.ACR_NAME || 'acrvaibhavrag2026') }}/verirag-backend:${{ steps.image-tag.outputs.tag }}"
          az containerapp update \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.BACKEND_APP_NAME }} \
            --image "$IMAGE_URI"

      - name: Deploy frontend
        run: |
          IMAGE_URI="${{ vars.ACR_LOGIN_SERVER || format('{0}.azurecr.io', vars.ACR_NAME || 'acrvaibhavrag2026') }}/verirag-frontend:${{ steps.image-tag.outputs.tag }}"
          az containerapp update \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.FRONTEND_APP_NAME }} \
            --image "$IMAGE_URI"

      - name: Verify deployment
        run: |
          az containerapp show \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.BACKEND_APP_NAME }} \
            --query "properties.latestRevisionFqdn" -o tsv
