{{- if .Values.redis.enabled }}
# ── Redis Deployment (Local Mode) ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "verirag.fullname" . }}-redis
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "verirag.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "verirag.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "verirag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | default "redis:7-alpine" }}
          ports:
            - containerPort: 6379
              name: redis
          command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
---
# ── Redis Service ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: {{ include "verirag.fullname" . }}-redis
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "verirag.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    {{- include "verirag.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
