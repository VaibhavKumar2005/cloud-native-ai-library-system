name: Frontend Security Scanning (Trivy)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-security.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
  schedule:
    - cron: '0 2 * * 0'  # Weekly scan on Sundays at 2 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan-frontend:
    name: Scan Frontend with Trivy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Frontend Docker image
        run: |
          cd frontend
          docker build -t verirag-frontend:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: verirag-frontend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail if CRITICAL or HIGH found

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-frontend-results.sarif') != ''
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'trivy-frontend'

      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-frontend-report
          path: trivy-frontend-results.sarif
          retention-days: 30

  trivy-scan-dependencies:
    name: Scan Frontend Dependencies
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy on package.json
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'frontend/'
          format: 'sarif'
          output: 'trivy-frontend-deps.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload dependency scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-frontend-deps.sarif') != ''
        with:
          sarif_file: 'trivy-frontend-deps.sarif'
          category: 'trivy-frontend-deps'

