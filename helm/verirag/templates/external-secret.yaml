{{- if and .Values.externalSecrets .Values.externalSecrets.enabled }}
# ──────────────────────────────────────────────────────────────────────────────
# External Secrets Operator — Azure Key Vault → K8s Secret
#
# Prerequisites:
#   1. Install ESO: helm install external-secrets external-secrets/external-secrets -n external-secrets-system --create-namespace
#   2. Configure Workload Identity on the AKS Service Account (see values-production.yaml)
#   3. Grant the managed identity "Key Vault Secrets User" role on the Key Vault
#
# This replaces the manual k8s/secrets.yaml — secrets never touch disk or Git.
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: {{ include "verirag.fullname" . }}-azure-kv
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "verirag.labels" . | nindent 4 }}
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ .Values.externalSecrets.azureKeyVaultUrl | quote }}
      serviceAccountRef:
        name: {{ include "verirag.serviceAccountName" . }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "verirag.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "verirag.labels" . | nindent 4 }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: {{ include "verirag.fullname" . }}-azure-kv
    kind: SecretStore
  target:
    name: {{ include "verirag.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    # ── Database Credentials ──
    - secretKey: POSTGRES_USER
      remoteRef:
        key: POSTGRES-USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: POSTGRES-PASSWORD
    # ── Django ──
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: DJANGO-SECRET-KEY
    # ── Redis URL (with access key embedded) ──
    - secretKey: REDIS_URL
      remoteRef:
        key: REDIS-CONNECTION-STRING
    # ── API Keys (fetched by settings.py get_secret(), but also available as env backup) ──
    - secretKey: GOOGLE_API_KEY
      remoteRef:
        key: GOOGLE-API-KEY
    - secretKey: GROQ_API_KEY
      remoteRef:
        key: GROQ-API-KEY
{{- end }}
