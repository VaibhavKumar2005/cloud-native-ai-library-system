name: Deploy

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to deploy'
        required: true
        default: 'main'
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Azure login (Workload Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend
        run: |
          IMAGE_URI="${{ vars.ACR_LOGIN_SERVER }}/verirag-backend:${{ github.sha }}"
          az containerapp update \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.BACKEND_APP_NAME }} \
            --image "$IMAGE_URI"

      - name: Deploy frontend
        run: |
          IMAGE_URI="${{ vars.ACR_LOGIN_SERVER }}/verirag-frontend:${{ github.sha }}"
          az containerapp update \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.FRONTEND_APP_NAME }} \
            --image "$IMAGE_URI"

      - name: Verify deployment
        run: |
          az containerapp show \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.BACKEND_APP_NAME }} \
            --query "properties.latestRevisionFqdn" -o tsv
