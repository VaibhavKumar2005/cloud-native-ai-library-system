name: VeriRAG CI/CD Pipeline

on:
  workflow_dispatch:  # Manual trigger only
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
    inputs:
      deploy_backend:
        description: 'Deploy backend'
        required: true
        default: 'true'
      deploy_worker:
        description: 'Deploy worker'
        required: true
        default: 'true'
      deploy_frontend:
        description: 'Deploy frontend'
        required: true
        default: 'true'

env:
  # Docker Registry
  REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER || 'docker.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
  
  # Azure
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  
  # Container Apps
  BACKEND_APP_NAME: ${{ vars.BACKEND_APP_NAME }}
  CELERY_APP_NAME: ${{ vars.CELERY_APP_NAME }}
  FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write  # For uploading security scan results

env:
  # Node.js 24 opt-in (required by June 2nd, 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================================================
  # STAGE 1: CONTINUOUS INTEGRATION (tests & validation)
  # ============================================================================
  
  ci:
    name: Test & Validate Code
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: verirag_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d verirag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Node.js 24 compatible

      - name: Set up Python 3.11
        uses: actions/setup-python@v5  # Node.js 24 compatible
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Run Django checks and tests
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DEBUG: "True"
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: "false"
        working-directory: apps/backend
        run: |
          python manage.py check --deploy || true
          python manage.py migrate --no-input
          python manage.py test ai_engine.tests librarian.tests verifier.tests --verbosity=2 --no-input

      - name: Set up Node.js 20
        uses: actions/setup-node@v4  # Node.js 24 compatible
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci --no-audit

      - name: Frontend build
        working-directory: apps/frontend
        run: npm run build

      - name: Backend Docker build check
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false

      - name: Frontend Docker build check
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: false
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}

  # ============================================================================
  # STAGE 2: CONTINUOUS DEPLOYMENT (build, scan, push, deploy)
  # Only runs on main branch and only if CI passed
  # ============================================================================
  
  cd:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC=$(echo "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "image_namespace=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY_SERVER}/${OWNER_LC}/verirag-backend:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY_SERVER}/${OWNER_LC}/verirag-frontend:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME || github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}

      # ─────────────────────────────────────────────────────────────────────
      # SECURITY SCANNING: Trivy (Vulnerabilities + Secrets + Config)
      # ─────────────────────────────────────────────────────────────────────
      
      - name: "🔐 Scan Backend Image - Vulnerabilities"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.backend_image }}
          scan-type: 'image'
          format: 'sarif'
          output: 'trivy-backend-vuln.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'  # Fail on vulnerabilities
          timeout: '10m'

      - name: "🔐 Scan Backend - Configuration Issues"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.backend_image }}
          scan-type: 'config'
          format: 'sarif'
          output: 'trivy-backend-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Config issues don't block, but we report them

      - name: "🔐 Scan Backend - Secrets & Credentials"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.backend_image }}
          scan-type: 'secret'
          format: 'sarif'
          output: 'trivy-backend-secrets.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Always fail if secrets found

      - name: "🔐 Scan Frontend Image - Vulnerabilities"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.frontend_image }}
          scan-type: 'image'
          format: 'sarif'
          output: 'trivy-frontend-vuln.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'  # Fail on vulnerabilities
          timeout: '10m'

      - name: "🔐 Scan Frontend - Configuration Issues"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.frontend_image }}
          scan-type: 'config'
          format: 'sarif'
          output: 'trivy-frontend-config.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Config issues don't block, but we report them

      - name: "🔐 Scan Frontend - Secrets & Credentials"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.frontend_image }}
          scan-type: 'secret'
          format: 'sarif'
          output: 'trivy-frontend-secrets.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Always fail if secrets found

      # ─────────────────────────────────────────────────────────────────────
      # UPLOAD SECURITY REPORTS TO GITHUB
      # ─────────────────────────────────────────────────────────────────────
      
      - name: "📊 Upload Backend Vulnerability Report"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-vuln.sarif'
          category: 'trivy-backend-vulnerabilities'

      - name: "📊 Upload Backend Configuration Report"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-config.sarif'
          category: 'trivy-backend-config'

      - name: "📊 Upload Backend Secrets Report"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-secrets.sarif'
          category: 'trivy-backend-secrets'

      - name: "📊 Upload Frontend Vulnerability Report"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-vuln.sarif'
          category: 'trivy-frontend-vulnerabilities'

      - name: "📊 Upload Frontend Configuration Report"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-config.sarif'
          category: 'trivy-frontend-config'

      - name: "📊 Upload Frontend Secrets Report"
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-secrets.sarif'
          category: 'trivy-frontend-secrets'

      # ─────────────────────────────────────────────────────────────────────
      # STORE SCAN ARTIFACTS FOR ANALYSIS
      # ─────────────────────────────────────────────────────────────────────
      
      - name: "💾 Save Trivy Reports as Artifacts"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-reports
          path: |
            trivy-backend-*.sarif
            trivy-frontend-*.sarif
          retention-days: 30

      - name: Login to Azure via Workload Identity Federation
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend image
        run: |
          az containerapp update \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.backend_image }}" \
            --output none

      - name: Deploy worker image
        run: |
          az containerapp update \
            --name "${{ env.CELERY_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.backend_image }}" \
            --output none

      - name: Deploy frontend image
        run: |
          az containerapp update \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.frontend_image }}" \
            --output none

      - name: Get deployment URLs
        id: deployment
        shell: bash
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name "${BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          FRONTEND_FQDN=$(az containerapp show \
            --name "${FRONTEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "backend_url=https://${BACKEND_FQDN}" >> "$GITHUB_OUTPUT"
          echo "frontend_url=https://${FRONTEND_FQDN}" >> "$GITHUB_OUTPUT"

      - name: Smoke test backend health
        shell: bash
        run: |
          echo "Waiting for backend to warm up..."
          sleep 30
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.deployment.outputs.backend_url }}/api/health/" || echo "000")
          if [ "${RESPONSE}" != "200" ]; then
            echo "⚠️ Backend health check returned ${RESPONSE} (expected 200)"
          else
            echo "✅ Backend health check passed"
          fi

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## 🚀 Deployment Summary"
            echo
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Commit | \`${{ steps.meta.outputs.sha_short }}\` |"
            echo "| Backend Image | \`${{ steps.meta.outputs.backend_image }}\` |"
            echo "| Frontend Image | \`${{ steps.meta.outputs.frontend_image }}\` |"
            echo "| Backend URL | ${{ steps.deployment.outputs.backend_url }} |"
            echo "| Frontend URL | ${{ steps.deployment.outputs.frontend_url }} |"
            echo "| Status | ✅ Deployed |"
          } >> "$GITHUB_STEP_SUMMARY"
