##############################################################################
# VeriRAG Kubernetes Deployments
# Covers: rag-backend, rag-celery-worker, rag-redis, rag-vault
# Note: PostgreSQL uses a StatefulSet (see statefulset.yaml)
##############################################################################

---
# ============================================================================
# 1. RAG Backend — Django REST API
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  namespace: verirag
  labels:
    app: rag-backend
    app.kubernetes.io/part-of: verirag
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-backend
  template:
    metadata:
      labels:
        app: rag-backend
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rag-db 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
        - name: run-migrations
          image: acrvaibhavrag2026.azurecr.io/verirag-backend:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: verirag-config
            - secretRef:
                name: verirag-secrets
      containers:
        - name: rag-backend
          image: acrvaibhavrag2026.azurecr.io/verirag-backend:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: verirag-config
            - secretRef:
                name: verirag-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: media-storage
              mountPath: /app/media
      volumes:
        - name: media-storage
          emptyDir: {}

---
# ============================================================================
# 2. Celery Worker — Background Task Processor
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-celery-worker
  namespace: verirag
  labels:
    app: rag-celery-worker
    app.kubernetes.io/part-of: verirag
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-celery-worker
  template:
    metadata:
      labels:
        app: rag-celery-worker
    spec:
      initContainers:
        - name: wait-for-backend
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rag-backend 8000; do
                echo "Waiting for backend..."
                sleep 3
              done
      containers:
        - name: celery-worker
          image: acrvaibhavrag2026.azurecr.io/verirag-backend:latest
          command:
            - celery
            - -A
            - rag_backend
            - worker
            - -l
            - info
            - -Q
            - celery,ingestion,monitoring,maintenance
          envFrom:
            - configMapRef:
                name: verirag-config
            - secretRef:
                name: verirag-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: media-storage
              mountPath: /app/media
      volumes:
        - name: media-storage
          emptyDir: {}

---
# ============================================================================
# 3. Celery Beat — Periodic Task Scheduler
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-celery-beat
  namespace: verirag
  labels:
    app: rag-celery-beat
    app.kubernetes.io/part-of: verirag
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-celery-beat
  template:
    metadata:
      labels:
        app: rag-celery-beat
    spec:
      containers:
        - name: celery-beat
          image: acrvaibhavrag2026.azurecr.io/verirag-backend:latest
          command:
            - celery
            - -A
            - rag_backend
            - beat
            - -l
            - info
          envFrom:
            - configMapRef:
                name: verirag-config
            - secretRef:
                name: verirag-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

---
# ============================================================================
# 4. Redis — Message Broker & Result Backend
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-redis
  namespace: verirag
  labels:
    app: rag-redis
    app.kubernetes.io/part-of: verirag
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-redis
  template:
    metadata:
      labels:
        app: rag-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              protocol: TCP
          command: ["redis-server", "--appendonly", "yes"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}

---
# ============================================================================
# 5. HashiCorp Vault — Secret Management
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-vault
  namespace: verirag
  labels:
    app: rag-vault
    app.kubernetes.io/part-of: verirag
    app.kubernetes.io/component: secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-vault
  template:
    metadata:
      labels:
        app: rag-vault
    spec:
      securityContext:
        runAsUser: 100
        runAsGroup: 1000
      containers:
        - name: vault
          image: vault:1.13.3
          ports:
            - containerPort: 8200
              protocol: TCP
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: verirag-secrets
                  key: VAULT_TOKEN
            - name: VAULT_ADDR
              value: "http://0.0.0.0:8200"
          securityContext:
            capabilities:
              add: ["IPC_LOCK"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 10
            periodSeconds: 10
