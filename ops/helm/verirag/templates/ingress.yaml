{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "verirag.fullname" . }}
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "verirag.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    {{- if .Values.ingress.tls }}
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ include "verirag.fullname" . }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "verirag.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port | default 8000 }}
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "verirag.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port | default 8000 }}
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: {{ include "verirag.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port | default 8000 }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "verirag.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port | default 8080 }}
{{- end }}
