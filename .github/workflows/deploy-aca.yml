name: VeriRAG Manual ACA Deploy

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: true
        default: main
      environment:
        description: GitHub environment name
        required: true
        default: production
      deploy_backend:
        description: Deploy backend API
        required: true
        type: boolean
        default: true
      deploy_worker:
        description: Deploy Celery worker
        required: true
        type: boolean
        default: true
      deploy_frontend:
        description: Deploy frontend
        required: true
        type: boolean
        default: true

env:
  REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER || 'ghcr.io' }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  BACKEND_APP_NAME: ${{ vars.BACKEND_APP_NAME }}
  CELERY_APP_NAME: ${{ vars.CELERY_APP_NAME }}
  FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Manual Build and Deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.summary.outputs.frontend_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC=$(echo "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "image_namespace=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY_SERVER}/${OWNER_LC}/verirag-backend:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY_SERVER}/${OWNER_LC}/verirag-frontend:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure backend registry access
        if: ${{ inputs.deploy_backend }}
        run: |
          az containerapp registry set \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ env.REGISTRY_SERVER }}" \
            --username "${{ secrets.REGISTRY_USERNAME }}" \
            --password "${{ secrets.REGISTRY_PASSWORD }}" \
            --output none

      - name: Deploy backend image
        if: ${{ inputs.deploy_backend }}
        run: |
          az containerapp update \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.backend_image }}" \
            --output none

      - name: Configure worker registry access
        if: ${{ inputs.deploy_worker }}
        run: |
          az containerapp registry set \
            --name "${{ env.CELERY_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ env.REGISTRY_SERVER }}" \
            --username "${{ secrets.REGISTRY_USERNAME }}" \
            --password "${{ secrets.REGISTRY_PASSWORD }}" \
            --output none

      - name: Deploy worker image
        if: ${{ inputs.deploy_worker }}
        run: |
          az containerapp update \
            --name "${{ env.CELERY_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.backend_image }}" \
            --output none

      - name: Configure frontend registry access
        if: ${{ inputs.deploy_frontend }}
        run: |
          az containerapp registry set \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --server "${{ env.REGISTRY_SERVER }}" \
            --username "${{ secrets.REGISTRY_USERNAME }}" \
            --password "${{ secrets.REGISTRY_PASSWORD }}" \
            --output none

      - name: Deploy frontend image
        if: ${{ inputs.deploy_frontend }}
        run: |
          az containerapp update \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.frontend_image }}" \
            --output none

      - name: Get deployment URLs
        id: summary
        shell: bash
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name "${BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          FRONTEND_FQDN=$(az containerapp show \
            --name "${FRONTEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "backend_url=https://${BACKEND_FQDN}" >> "$GITHUB_OUTPUT"
          echo "frontend_url=https://${FRONTEND_FQDN}" >> "$GITHUB_OUTPUT"

      - name: Smoke test backend health
        if: ${{ inputs.deploy_backend }}
        shell: bash
        run: |
          echo "Waiting for backend revision to warm up..."
          sleep 30
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.summary.outputs.backend_url }}/api/health/" || echo "000")
          if [ "${RESPONSE}" != "200" ]; then
            echo "Backend health check failed with status ${RESPONSE}"
            exit 1
          fi

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "### Manual ACA deployment"
            echo
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Ref | \`${{ inputs.git_ref }}\` |"
            echo "| Commit tag | \`${{ steps.meta.outputs.sha_short }}\` |"
            echo "| Registry | \`${{ env.REGISTRY_SERVER }}\` |"
            echo "| Backend image | \`${{ steps.meta.outputs.backend_image }}\` |"
            echo "| Frontend image | \`${{ steps.meta.outputs.frontend_image }}\` |"
            echo "| Backend URL | ${{ steps.summary.outputs.backend_url }} |"
            echo "| Frontend URL | ${{ steps.summary.outputs.frontend_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
