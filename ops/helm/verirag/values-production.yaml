###############################################################################
# VeriRAG Helm Values — CLOUD MODE (Azure Container Apps / AKS)
#
# Overlay on top of values.yaml:
#   helm install verirag ./helm/verirag -f values.yaml -f values-production.yaml \
#     --set secrets.postgresPassword=$PG_PASS --set secrets.djangoSecretKey=$DJ_KEY
#
# Key differences from local:
#   - postgresql.enabled=false  → Azure Database for PostgreSQL Flexible Server
#   - redis.enabled=false       → Azure Cache for Redis
#   - vault.enabled=false       → Azure Key Vault (via External Secrets Operator)
#   - autoscaling.enabled=true  → HPA for backend
#   - keda.enabled=true         → Scale-to-zero for Celery workers
#   - ingress.enabled=true      → TLS-terminated ingress
###############################################################################

# ── Global ─────────────────────────────────────────────────────────────────
global:
  deployMode: cloud
  namespace: verirag
  imagePullPolicy: Always

# ── Backend ────────────────────────────────────────────────────────────────
backend:
  replicaCount: 2
  image:
    repository: vaibhavkumar0412/verirag-backend
    tag: "latest"  # Overridden by Argo CD Image Updater with SHA-short tags
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  service:
    type: ClusterIP
    port: 8000
  env:
    DJANGO_SETTINGS_MODULE: "rag_backend.settings"
    DEBUG: "False"
    DEPLOY_MODE: "cloud"
    ALLOWED_HOSTS: "verirag.example.com,verirag-backend.verirag.svc.cluster.local"
    CORS_ALLOWED_ORIGINS: "https://verirag.example.com"

# ── Frontend ───────────────────────────────────────────────────────────────
frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: vaibhavkumar0412/verirag-frontend
    tag: "latest"
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 8080

# ── Celery Worker ──────────────────────────────────────────────────────────
celeryWorker:
  replicaCount: 0  # Managed by KEDA (scale-to-zero)
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  queues: "celery,ingestion,monitoring,maintenance"

# ── Celery Beat ────────────────────────────────────────────────────────────
celeryBeat:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ── PostgreSQL — DISABLED (Azure Managed Service) ─────────────────────────
postgresql:
  enabled: false
  externalHost: "psql-verirag-dev.postgres.database.azure.com"
  auth:
    database: verirag_db
  # Credentials come from External Secrets → Azure Key Vault

# ── Redis — DISABLED (Azure Cache for Redis) ──────────────────────────────
redis:
  enabled: false
  externalUrl: "rediss://:ACCESS_KEY@redis-verirag-dev.redis.cache.windows.net:6380/0"
  # RedisURL with SSL prefix (rediss://) — populated from External Secrets

# ── Vault — DISABLED (Azure Key Vault) ────────────────────────────────────
vault:
  enabled: false
  azureKeyVaultUrl: "https://kv-verirag-dev.vault.azure.net/"

# ── External Secrets Operator ──────────────────────────────────────────────
externalSecrets:
  enabled: true
  provider: azure-key-vault
  azureKeyVaultUrl: "https://kv-verirag-dev.vault.azure.net/"
  # Authentication: Workload Identity (recommended) or Service Principal
  # See external-secret.yaml template for details

# ── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: verirag.example.com
  tls: true

# ── HPA ────────────────────────────────────────────────────────────────────
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

# ── KEDA (Redis queue-based scaling for Celery workers) ────────────────────
keda:
  enabled: true
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 10
  listLength: "5"

# ── Service Account with Workload Identity annotation ─────────────────────
serviceAccount:
  create: true
  name: verirag-sa
  annotations:
    azure.workload.identity/client-id: "<MANAGED_IDENTITY_CLIENT_ID>"

# ── Pod Security (same as local — AZ-400 compliance) ──────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL
