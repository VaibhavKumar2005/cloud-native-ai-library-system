# VeriRAG Kustomization — GitOps-Ready Resource Manager
# Apply with: kubectl apply -k k8s/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: verirag

resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.yaml
  - statefulset.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/part-of: verirag
  app.kubernetes.io/managed-by: kustomize

# Image overrides — update tags for CI/CD pipelines
images:
  - name: acrvaibhavrag2026.azurecr.io/verirag-backend
    newTag: latest
