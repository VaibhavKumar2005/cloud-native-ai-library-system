# ──────────────────────────────────────────────────────────────────────────────
# VeriRAG — Secrets (referenced by ExternalSecret in cloud mode)
#
# In LOCAL mode:  This Secret is created from values you provide at install.
# In CLOUD mode:  ExternalSecrets Operator populates this from Azure Key Vault.
#                 Do NOT set secrets manually — use external-secret.yaml instead.
# ──────────────────────────────────────────────────────────────────────────────
{{- if eq (lower (.Values.global.deployMode | default "local")) "local" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "verirag.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "verirag.labels" . | nindent 4 }}
type: Opaque
stringData:
  # These MUST be overridden at install time via --set or a sealed values file.
  # helm install verirag ./helm/verirag --set secrets.postgresUser=... --set secrets.postgresPassword=...
  POSTGRES_USER: {{ .Values.secrets.postgresUser | default "admin" | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  DJANGO_SECRET_KEY: {{ required "secrets.djangoSecretKey is required" .Values.secrets.djangoSecretKey | quote }}
  {{- if .Values.vault.enabled }}
  VAULT_TOKEN: {{ required "secrets.vaultToken is required when vault is enabled" .Values.secrets.vaultToken | quote }}
  {{- end }}
{{- end }}
