name: Backend Security Scanning (Trivy)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-security.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/backend/**'
  schedule:
    - cron: '0 2 * * 0'  # Weekly scan on Sundays at 2 AM UTC

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan-backend:
    name: Scan Backend with Trivy
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Docker image
        run: |
          cd apps/backend
          docker build -t verirag-backend:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: verirag-backend:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'  # Fail if CRITICAL or HIGH found

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'trivy-backend'

      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-backend-report
          path: trivy-backend-results.sarif
          retention-days: 30

  trivy-scan-dependencies:
    name: Scan Backend Dependencies
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy on requirements.txt
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend/requirements.txt'
          format: 'sarif'
          output: 'trivy-backend-deps.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload dependency scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-deps.sarif'
          category: 'trivy-backend-deps'

  python-bandit-scan:
    name: Scan Backend Code with Bandit
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit on backend code
        run: |
          bandit -r apps/backend/ai_engine/ -f json -o bandit-report.json || true

      - name: Convert Bandit to SARIF
        run: |
          pip install bandit-sarif-formatter
          python -m bandit_sarif_formatter bandit-report.json -o bandit-results.sarif || true

      - name: Upload Bandit results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'bandit-results.sarif'
          category: 'bandit'

