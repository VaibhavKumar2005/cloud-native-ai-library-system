name: VeriRAG CI/CD → ACR → ACA (Improved & FIXED)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  # Azure Container Registry
  ACR_REGISTRY: acrvaibhavrag2026.azurecr.io
  ACR_REPOSITORY: verirag
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_TAG_SHORT: ${{ github.sha }}
  
  # Azure Environment (from secrets and variables)
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  
  # ✅ FIXED: Add missing app name variables
  BACKEND_APP_NAME: ${{ vars.BACKEND_APP_NAME }}
  CELERY_APP_NAME: ${{ vars.CELERY_APP_NAME }}
  FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}
  
  LOCATION: eastus
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write
  security-events: write
  checks: write
  actions: read

jobs:
  # ============================================================================
  # STAGE 0: VALIDATION
  # ============================================================================
  validate-environment:
    name: Validate Environment
    runs-on: ubuntu-latest
    
    steps:
      - name: Check required variables
        run: |
          MISSING_VARS=()
          
          [[ -z "${{ env.AZURE_CLIENT_ID }}" ]] && MISSING_VARS+=("AZURE_CLIENT_ID")
          [[ -z "${{ env.AZURE_TENANT_ID }}" ]] && MISSING_VARS+=("AZURE_TENANT_ID")
          [[ -z "${{ env.AZURE_SUBSCRIPTION_ID }}" ]] && MISSING_VARS+=("AZURE_SUBSCRIPTION_ID")
          [[ -z "${{ env.AZURE_RESOURCE_GROUP }}" ]] && MISSING_VARS+=("AZURE_RESOURCE_GROUP")
          [[ -z "${{ env.BACKEND_APP_NAME }}" ]] && MISSING_VARS+=("BACKEND_APP_NAME")
          [[ -z "${{ env.CELERY_APP_NAME }}" ]] && MISSING_VARS+=("CELERY_APP_NAME")
          [[ -z "${{ env.FRONTEND_APP_NAME }}" ]] && MISSING_VARS+=("FRONTEND_APP_NAME")
          
          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo "❌ Missing required variables:"
            printf '  - %s\n' "${MISSING_VARS[@]}"
            exit 1
          fi
          
          echo "✅ All required variables are configured"

  # ============================================================================
  # STAGE 1: CONTINUOUS INTEGRATION
  # ============================================================================
  ci:
    name: Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-environment
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: verirag_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d verirag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Run Django checks
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'True'
          ALLOWED_HOSTS: 'localhost,127.0.0.1,0.0.0.0,backend,rag-backend'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
        run: python manage.py check --deploy

      - name: Run database migrations
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'False'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
        run: python manage.py migrate --no-input

      - name: Run backend tests
        id: backend-tests
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'True'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
        run: |
          pip install pytest pytest-django pytest-cov
          pytest tests/ \
            --cov=ai_engine \
            --cov=librarian \
            --cov=verifier \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-summary \
            --junitxml=junit.xml \
            -v

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: apps/backend/junit.xml
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/backend/htmlcov/
          retention-days: 30

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci --no-audit

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Run frontend linter
        working-directory: apps/frontend
        id: frontend-lint
        continue-on-error: true
        run: npm run lint

      - name: Run frontend tests
        working-directory: apps/frontend
        continue-on-error: true
        run: npm test || echo "No tests configured"

      - name: Report CI status
        if: always()
        run: |
          {
            echo "## ✅ CI Results"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Django checks | ✅ Pass |"
            echo "| Database migrations | ✅ Pass |"
            echo "| Backend tests | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Frontend build | ✅ Pass |"
            echo "| Frontend lint | ${{ steps.frontend-lint.outcome == 'success' && '✅ Pass' || '⚠️ Warnings' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # STAGE 2: SECURITY SCANNING
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy scan backend dependencies
        id: trivy-backend
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend/requirements.txt'
          format: 'sarif'
          output: 'trivy-backend-deps.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Trivy scan frontend dependencies
        id: trivy-frontend
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/frontend/package.json'
          format: 'sarif'
          output: 'trivy-frontend-deps.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload backend security results
        if: always() && hashFiles('trivy-backend-deps.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-deps.sarif
          category: trivy-backend-dependencies
          wait-for-processing: false

      - name: Upload frontend security results
        if: always() && hashFiles('trivy-frontend-deps.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend-deps.sarif
          category: trivy-frontend-dependencies
          wait-for-processing: false

      - name: Store SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: trivy-*.sarif
          retention-days: 90

  # ============================================================================
  # STAGE 3: BUILD & PUSH TO ACR
  # ============================================================================
  build-push-acr:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ci, security]
    if: github.ref == 'refs/heads/main'
    
    outputs:
      backend-image: ${{ steps.build-backend-output.outputs.image }}
      frontend-image: ${{ steps.build-frontend-output.outputs.image }}
      commit-sha: ${{ github.sha }}
      commit-ref: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR credentials
        id: acr-creds
        run: |
          ACR_NAME="${ACR_REGISTRY%.azurecr.io}"
          echo "🔐 Authenticating to $ACR_NAME..."
          
          ACR_USERNAME=$(az acr credential show --name "$ACR_NAME" --query 'username' -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)
          
          if [[ -z "$ACR_USERNAME" ]] || [[ -z "$ACR_PASSWORD" ]]; then
            echo "❌ Failed to retrieve ACR credentials"
            exit 1
          fi
          
          echo "::add-mask::$ACR_PASSWORD"
          echo "username=$ACR_USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$ACR_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "✅ ACR credentials retrieved"

      - name: Docker login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ steps.acr-creds.outputs.username }}
          password: ${{ steps.acr-creds.outputs.password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:${{ env.IMAGE_TAG_SHORT }}
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:buildcache,mode=max

      - name: Set backend image output
        id: build-backend-output
        run: echo "image=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:${{ env.IMAGE_TAG_SHORT }}" >> "$GITHUB_OUTPUT"

      - name: Build & push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:${{ env.IMAGE_TAG_SHORT }}
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:buildcache,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}

      - name: Set frontend image output
        id: build-frontend-output
        run: echo "image=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:${{ env.IMAGE_TAG_SHORT }}" >> "$GITHUB_OUTPUT"

  # ============================================================================
  # STAGE 4: DEPLOY TO AZURE CONTAINER APPS
  # ============================================================================
  deploy-aca:
    name: Deploy to ACA
    runs-on: ubuntu-latest
    needs: build-push-acr
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ FIXED: Use env variables instead of secrets
      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # ✅ FIXED: Pre-deployment validation
      - name: Pre-deployment checks
        run: |
          echo "📋 Verifying container apps exist..."
          
          APPS=("${{ env.BACKEND_APP_NAME }}" "${{ env.FRONTEND_APP_NAME }}" "${{ env.CELERY_APP_NAME }}")
          FAILED=0
          
          for APP in "${APPS[@]}"; do
            if [ -z "$APP" ]; then
              echo "❌ ERROR: App name is empty!"
              FAILED=1
              continue
            fi
            
            if az containerapp show \
              --name "$APP" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              &>/dev/null; then
              echo "✅ Found: $APP"
            else
              echo "❌ Not found: $APP"
              FAILED=1
            fi
          done
          
          [ $FAILED -eq 0 ] || exit 1
          echo "✅ All apps verified"

      # Deploy backend
      - name: Deploy backend to ACA
        run: |
          echo "🚀 Deploying backend..."
          
          az containerapp update \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-push-acr.outputs.backend-image }}" \
            --output none
          
          echo "✅ Backend deployment triggered"

      # Deploy Celery worker
      - name: Deploy Celery worker to ACA
        run: |
          echo "🚀 Deploying Celery worker..."
          
          az containerapp update \
            --name "${{ env.CELERY_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-push-acr.outputs.backend-image }}" \
            --output none
          
          echo "✅ Celery deployment triggered"

      # Deploy frontend
      - name: Deploy frontend to ACA
        run: |
          echo "🚀 Deploying frontend..."
          
          az containerapp update \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.build-push-acr.outputs.frontend-image }}" \
            --output none
          
          echo "✅ Frontend deployment triggered"

      - name: Wait for deployments
        run: |
          echo "⏳ Waiting 45 seconds for containers to update..."
          sleep 45
          echo "✅ Ready for health checks"

      # Health checks with retry
      - name: Health check - Backend
        id: backend-check
        continue-on-error: true
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv)
          
          echo "backend_fqdn=$BACKEND_FQDN" >> "$GITHUB_OUTPUT"
          
          echo "🔍 Checking backend at https://$BACKEND_FQDN/api/health/"
          
          for i in {1..5}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://$BACKEND_FQDN/api/health/" || echo "000")
            [ "$HTTP" = "200" ] && echo "✅ Backend healthy (HTTP $HTTP)" && exit 0
            echo "  Attempt $i/5: HTTP $HTTP"
            [ $i -lt 5 ] && sleep 10
          done
          
          echo "⚠️ Backend checks incomplete (may still be warming up)"

      - name: Health check - Frontend
        id: frontend-check
        continue-on-error: true
        run: |
          FRONTEND_FQDN=$(az containerapp show \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv)
          
          echo "frontend_fqdn=$FRONTEND_FQDN" >> "$GITHUB_OUTPUT"
          
          echo "🔍 Checking frontend at https://$FRONTEND_FQDN/"
          
          for i in {1..5}; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "https://$FRONTEND_FQDN/" || echo "000")
            if [ "$HTTP" = "200" ] || [ "$HTTP" = "304" ]; then
              echo "✅ Frontend healthy (HTTP $HTTP)"
              exit 0
            fi
            echo "  Attempt $i/5: HTTP $HTTP"
            [ $i -lt 5 ] && sleep 10
          done
          
          echo "⚠️ Frontend checks incomplete (may still be warming up)"

      # Diagnostics on failure
      - name: Collect logs on failure
        if: failure()
        continue-on-error: true
        run: |
          echo "📋 Collecting diagnostic logs..."
          
          echo "=== Backend Logs ==="
          az containerapp logs show \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --tail 50 || echo "Could not retrieve logs"
          
          echo ""
          echo "=== Frontend Logs ==="
          az containerapp logs show \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --tail 50 || echo "Could not retrieve logs"

      # Summary
      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## 🚀 VeriRAG Deployment Complete"
            echo ""
            echo "### Status"
            echo "${{ job.status == 'success' && '✅ **Deployment Successful**' || '⚠️ **Deployment Completed with Warnings**' }}"
            echo ""
            echo "### Services"
            echo ""
            echo "**Backend**"
            echo "- Image: \`${{ needs.build-push-acr.outputs.backend-image }}\`"
            echo "- URL: https://${{ steps.backend-check.outputs.backend_fqdn }}"
            echo ""
            echo "**Frontend**"
            echo "- Image: \`${{ needs.build-push-acr.outputs.frontend-image }}\`"
            echo "- URL: https://${{ steps.frontend-check.outputs.frontend_fqdn }}"
            echo ""
            echo "**Celery Worker**"
            echo "- Image: \`${{ needs.build-push-acr.outputs.backend-image }}\`"
            echo "- Status: Internal service"
            echo ""
            echo "### Metadata"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Region: East US"
            echo "- Resource Group: \`${{ env.AZURE_RESOURCE_GROUP }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

