apiVersion: v1
kind: ConfigMap
metadata:
  name: verirag-config
  namespace: verirag
  labels:
    app.kubernetes.io/part-of: verirag
data:
  # === Django Settings ===
  DJANGO_SETTINGS_MODULE: "rag_backend.settings"
  DEBUG: "False"
  ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,rag-backend,rag-backend.verirag.svc.cluster.local"

  # === Database ===
  POSTGRES_HOST: "rag-db"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "verirag_db"

  # === Redis ===
  REDIS_URL: "redis://rag-redis:6379/0"
  CELERY_BROKER_URL: "redis://rag-redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://rag-redis:6379/0"

  # === Vault ===
  VAULT_ADDR: "http://rag-vault:8200"

  # === Cors ===
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
