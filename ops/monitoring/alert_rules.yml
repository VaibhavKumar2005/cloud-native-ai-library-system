# ============================================================================
# VeriRAG Prometheus Alert Rules
# Define alerts for operational metrics and thresholds
# ============================================================================

groups:
  # ========================================================================
  # COST OPS ALERTS
  # ========================================================================
  - name: costops_alerts
    interval: 1m
    rules:
      - alert: DailyBudgetExceeded
        expr: sum(cost_ops_daily_cost_usd) > 50
        for: 5m
        labels:
          severity: critical
          service: costops
        annotations:
          summary: "Daily budget exceeded"
          description: "Daily cost ({{ $value | humanize }}) exceeds $50 limit"
      
      - alert: HighHourlySpend
        expr: rate(cost_ops_cumulative_cost_usd[1h]) > 5
        for: 10m
        labels:
          severity: warning
          service: costops
        annotations:
          summary: "High hourly spend rate"
          description: "Hourly spend rate ${{ $value }} exceeds $5/hr threshold"
      
      - alert: BudgetUtilizationWarning
        expr: (sum(cost_ops_cumulative_cost_usd) / 1000) > 0.75
        for: 15m
        labels:
          severity: warning
          service: costops
        annotations:
          summary: "Budget utilization above 75%"
          description: "Monthly budget is {{ humanizePercentage $value }} utilized"

  # ========================================================================
  # QUALITY OPS ALERTS
  # ========================================================================
  - name: qualityops_alerts
    interval: 1m
    rules:
      - alert: QualityScoreBelowThreshold
        expr: avg(quality_ops_combined_score) < 0.65
        for: 10m
        labels:
          severity: critical
          service: qualityops
        annotations:
          summary: "Quality score critical"
          description: "Average quality score ({{ $value | humanize }}) below 0.65 threshold"
      
      - alert: HighFailureRate
        expr: |
          (sum(quality_ops_tier_poor_count) / 
           (sum(quality_ops_tier_excellent_count) + 
            sum(quality_ops_tier_good_count) + 
            sum(quality_ops_tier_acceptable_count) + 
            sum(quality_ops_tier_poor_count))) > 0.2
        for: 15m
        labels:
          severity: warning
          service: qualityops
        annotations:
          summary: "High poor-quality response rate"
          description: "{{ humanizePercentage $value }} of responses rated poor"
      
      - alert: FaithfulnessScoreLow
        expr: avg(quality_ops_faithfulness) < 0.6
        for: 10m
        labels:
          severity: warning
          service: qualityops
        annotations:
          summary: "Faithfulness score below acceptable"
          description: "Faithfulness score ({{ $value | humanize }}) below 0.60 threshold"

  # ========================================================================
  # DRIFT OPS ALERTS
  # ========================================================================
  - name: driftops_alerts
    interval: 2m
    rules:
      - alert: EmbeddingDriftDetected
        expr: drift_ops_embedding_drift_distance > 0.20
        for: 10m
        labels:
          severity: warning
          service: driftops
          drift_type: embedding
        annotations:
          summary: "Embedding drift detected"
          description: "Embedding drift distance ({{ $value | humanize }}) exceeds 0.20"
      
      - alert: ResponsePatternShift
        expr: drift_ops_quality_drift_percent > 0.15
        for: 15m
        labels:
          severity: warning
          service: driftops
          drift_type: response_pattern
        annotations:
          summary: "Response pattern shift detected"
          description: "Quality shift ({{ $value | humanizePercentage }}) exceeds 15% threshold"
      
      - alert: CriticalDriftAlert
        expr: sum(increase(drift_ops_critical_alerts_total[1h])) > 0
        for: 5m
        labels:
          severity: critical
          service: driftops
        annotations:
          summary: "Critical drift alert generated"
          description: "{{ $value }} critical drift alerts in the last hour"

  # ========================================================================
  # RAG PIPELINE ALERTS
  # ========================================================================
  - name: rag_alerts
    interval: 1m
    rules:
      - alert: QueryLatencyHigh
        expr: histogram_quantile(0.95, rate(rag_query_latency_ms_bucket[5m])) > 5000
        for: 10m
        labels:
          severity: warning
          service: rag
        annotations:
          summary: "RAG query latency p95 > 5s"
          description: "p95 latency: {{ $value | humanize }}ms"
      
      - alert: QuerySuccessRateLow
        expr: |
          (sum(rate(rag_queries_passed[5m])) / 
           sum(rate(rag_queries_total[5m]))) < 0.90
        for: 15m
        labels:
          severity: warning
          service: rag
        annotations:
          summary: "RAG query success rate below 90%"
          description: "Success rate: {{ humanizePercentage $value }}"
      
      - alert: HighFallbackRate
        expr: |
          (sum(rate(rag_llm_fallbacks_total[5m])) / 
           sum(rate(rag_queries_total[5m]))) > 0.2
        for: 10m
        labels:
          severity: warning
          service: rag
        annotations:
          summary: "High LLM fallback rate"
          description: "Fallback rate: {{ humanizePercentage $value }} (should be < 20%)"

  # ========================================================================
  # SYSTEM HEALTH ALERTS
  # ========================================================================
  - name: system_health
    interval: 1m
    rules:
      - alert: PostgresqlDown
        expr: pg_up{job="postgres-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          service: postgresql
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database is not responding"
      
      - alert: RedisDown
        expr: redis_up{job="redis-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis is down"
          description: "Redis cache is not responding"
      
      - alert: HighDiskUsage
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.15
        for: 10m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "Disk usage above 85%"
          description: "Available disk: {{ humanizePercentage $value }}"
