###############################################################################
# VeriRAG — CI/CD Pipeline with Docker Hub & Azure Container Apps
# Builds Docker images, pushes to Docker Hub, deploys to Azure Container Apps
# Follows DevOps best practices: automated testing, security scanning, deployment
###############################################################################
name: VeriRAG CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infrastructure/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: vaibhavkumar0412
  BACKEND_IMAGE: vaibhavkumar0412/verirag-backend
  FRONTEND_IMAGE: vaibhavkumar0412/verirag-frontend
  AZURE_RESOURCE_GROUP: rg-verirag-dev
  BACKEND_APP_NAME: ca-verirag-dev-backend
  CELERY_APP_NAME: ca-verirag-dev-celery-worker

permissions:
  contents: write
  packages: write
  security-events: write
  id-token: write  # Required for OIDC login to Azure

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Lint & Test
  # ═══════════════════════════════════════════════════════════════════════════
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: verirag_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U admin -d verirag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run Django tests
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DEBUG: 'True'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd backend
          python manage.py test --verbosity=2 --no-input

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint & build check
        run: |
          cd frontend
          npm ci --no-audit
          npm run build

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Build & Push Docker Images to Docker Hub
  # ═══════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: Build & Push to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_short }}
      full_sha: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "branch=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Build & Push Backend ────────────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      # ── Build & Push Frontend ───────────────────────────────────────────
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.verirag.dev' }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

      - name: Generate build summary
        run: |
          echo "### 🐳 Docker Images Built & Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ steps.meta.outputs.sha_short }}\` | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ steps.meta.outputs.sha_short }}\` | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Hub:** [vaibhavkumar0412](https://hub.docker.com/u/vaibhavkumar0412)" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: Deploy to Azure Container Apps
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-azure:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://${{ steps.get-url.outputs.backend_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update backend container app
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} \
            --output none
          echo "✅ Backend updated to image tag: ${{ needs.build-and-push.outputs.image_tag }}"

      - name: Update Celery worker container app
        run: |
          az containerapp update \
            --name ${{ env.CELERY_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }} \
            --output none
          echo "✅ Celery worker updated to image tag: ${{ needs.build-and-push.outputs.image_tag }}"

      - name: Get backend URL
        id: get-url
        run: |
          BACKEND_URL=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "backend_url=${BACKEND_URL}" >> "$GITHUB_OUTPUT"
          echo "Backend URL: https://${BACKEND_URL}"

      - name: Health check
        run: |
          echo "⏳ Waiting 30s for containers to start..."
          sleep 30
          
          BACKEND_URL="https://${{ steps.get-url.outputs.backend_url }}"
          echo "Testing health endpoint: ${BACKEND_URL}/api/health/"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${BACKEND_URL}/api/health/" || echo "000")
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Health check passed!"
          else
            echo "⚠️  Health check returned: $RESPONSE (may need more warmup time)"
          fi

      - name: Generate deployment summary
        run: |
          echo "### 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Image Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ✅ Deployed | \`${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Celery Worker | ✅ Deployed | \`${{ needs.build-and-push.outputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Backend URL:** https://${{ steps.get-url.outputs.backend_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ needs.build-and-push.outputs.full_sha }}" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 4: Security Scan (DevOps Best Practice)
  # ═══════════════════════════════════════════════════════════════════════════
  security-scan:
    name: Security Scan
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Run Trivy vulnerability scanner (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.BACKEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend.sarif'
          category: 'backend-security'

      - name: Run Trivy vulnerability scanner (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.FRONTEND_IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      - name: Upload Frontend scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend.sarif'
          category: 'frontend-security'
