###############################################################################
# VeriRAG — Argo CD Application Manifest
#
# This Application resource tells Argo CD to:
#   1. Watch the k8s-manifests repository for changes
#   2. Sync the Helm chart to the verirag namespace
#   3. Auto-prune orphaned resources
#
# Prerequisites:
#   - Argo CD installed in the cluster (argocd namespace)
#   - Repository credentials configured in Argo CD
###############################################################################
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: verirag
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: verirag
    app.kubernetes.io/managed-by: argocd
  # Enable cascading deletion — remove K8s resources when App is deleted
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # ── Option A: Helm chart from manifests repo ───────────────────────────
    repoURL: https://github.com/VaibhavKumar2005/verirag-k8s-manifests.git
    targetRevision: main
    path: helm/verirag

    helm:
      # Use production overrides when deploying to cloud
      valueFiles:
        - values.yaml           # base defaults
        - values-production.yaml # Azure overrides (managed PG, Redis, Key Vault)

      # Runtime parameter overrides (can be set from Argo CD UI too)
      parameters: []

  destination:
    server: https://kubernetes.default.svc
    namespace: verirag

  syncPolicy:
    automated:
      # Auto-sync when Git changes are detected
      prune: true       # Remove resources no longer in Git
      selfHeal: true    # Revert manual kubectl changes
      allowEmpty: false # Never sync an empty repo

    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Ignore known diffs that cause unnecessary syncs
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # HPA manages replicas

---
###############################################################################
# Argo CD Application — Local Mode (Kind/Minikube)
# Uses local values.yaml only (HashiCorp Vault container, local Redis)
###############################################################################
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: verirag-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: verirag
    environment: local
spec:
  project: default

  source:
    repoURL: https://github.com/VaibhavKumar2005/verirag-k8s-manifests.git
    targetRevision: main
    path: helm/verirag

    helm:
      valueFiles:
        - values.yaml  # Local mode only — no Azure overrides

  destination:
    server: https://kubernetes.default.svc
    namespace: verirag

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
