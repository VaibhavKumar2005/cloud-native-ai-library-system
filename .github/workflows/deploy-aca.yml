name: VeriRAG Manual ACA Deploy

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: true
        default: main
      environment:
        description: GitHub environment name
        required: true
        default: production
      deploy_backend:
        description: Deploy backend API
        required: true
        type: boolean
        default: true
      deploy_worker:
        description: Deploy Celery worker
        required: true
        type: boolean
        default: true
      deploy_frontend:
        description: Deploy frontend
        required: true
        type: boolean
        default: true

env:
  # ACR Configuration (set in environment variables, not secrets)
  REGISTRY_SERVER: ${{ vars.REGISTRY_SERVER || 'ghcr.io' }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE || github.repository_owner }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  BACKEND_APP_NAME: ${{ vars.BACKEND_APP_NAME }}
  CELERY_APP_NAME: ${{ vars.CELERY_APP_NAME }}
  FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}
  # Azure Authentication via Workload Identity Federation (variables, not secrets)
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Manual Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.summary.outputs.frontend_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Validate deployment prerequisites
        shell: bash
        run: |
          echo "✓ Validating git ref and CI status..."
          git fetch origin "${{ inputs.git_ref }}" || { echo "❌ Git ref not found"; exit 1; }
          echo "✓ Git ref '${{ inputs.git_ref }}' validated"
          echo "⚠️  Manual deployment triggered - skipping CI validation for now"
          echo "   (In production, query GitHub API to confirm CI passed on this ref)"

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          OWNER_LC=$(echo "${IMAGE_NAMESPACE}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(git rev-parse --short HEAD)
          GIT_REF=$(echo "${{ inputs.git_ref }}" | sed 's|.*/||')
          echo "image_namespace=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY_SERVER}/${OWNER_LC}/verirag-backend:${GIT_REF}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${REGISTRY_SERVER}/${OWNER_LC}/verirag-frontend:${GIT_REF}-${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # BEFORE: Uses username/password (insecure, doesn't work with ACR unless admin account enabled)
      # AFTER: Uses Workload Identity Federation - completely serverless, no stored credentials
      - name: Login to Azure via Workload Identity Federation
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure resources exist
        shell: bash
        run: |
          echo "Validating target Azure Container Apps resources..."
          
          if [[ -n "${{ inputs.deploy_backend }}" ]]; then
            az containerapp show \
              --name "${{ env.BACKEND_APP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query name -o tsv || { echo "❌ Backend Container App not found"; exit 1; }
            echo "✓ Backend Container App '${{ env.BACKEND_APP_NAME }}' found"
          fi
          
          if [[ -n "${{ inputs.deploy_worker }}" ]]; then
            az containerapp show \
              --name "${{ env.CELERY_APP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query name -o tsv || { echo "❌ Worker Container App not found"; exit 1; }
            echo "✓ Worker Container App '${{ env.CELERY_APP_NAME }}' found"
          fi
          
          if [[ -n "${{ inputs.deploy_frontend }}" ]]; then
            az containerapp show \
              --name "${{ env.FRONTEND_APP_NAME }}" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --query name -o tsv || { echo "❌ Frontend Container App not found"; exit 1; }
            echo "✓ Frontend Container App '${{ env.FRONTEND_APP_NAME }}' found"
          fi

      - name: Login to ACR via Azure managed identity
        shell: bash
        run: |
          az acr login --name "${{ env.ACR_NAME }}"

      - name: Login to container registry for Docker build
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME || github.repository_owner }}
          password: ${{ env.REGISTRY_SERVER == 'ghcr.io' && secrets.GITHUB_TOKEN || secrets.REGISTRY_PASSWORD || secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}

      # IMPORTANT: Remove registry credential steps!
      # The Container Apps now pull images via their own managed
      # identities (granted acrPull role on the ACR). No stored credentials needed.

      - name: Deploy backend image
        if: ${{ inputs.deploy_backend }}
        run: |
          az containerapp update \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.backend_image }}" \
            --output none

      - name: Deploy worker image
        if: ${{ inputs.deploy_worker }}
        run: |
          az containerapp update \
            --name "${{ env.CELERY_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.backend_image }}" \
            --output none

      - name: Deploy frontend image
        if: ${{ inputs.deploy_frontend }}
        run: |
          az containerapp update \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "${{ steps.meta.outputs.frontend_image }}" \
            --output none

      - name: Get deployment URLs
        id: summary
        shell: bash
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name "${BACKEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          FRONTEND_FQDN=$(az containerapp show \
            --name "${FRONTEND_APP_NAME}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          echo "backend_url=https://${BACKEND_FQDN}" >> "$GITHUB_OUTPUT"
          echo "frontend_url=https://${FRONTEND_FQDN}" >> "$GITHUB_OUTPUT"

      - name: Smoke test backend health
        if: ${{ inputs.deploy_backend }}
        shell: bash
        run: |
          echo "Waiting for backend revision to warm up..."
          sleep 30
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.summary.outputs.backend_url }}/api/health/" || echo "000")
          if [ "${RESPONSE}" != "200" ]; then
            echo "Backend health check failed with status ${RESPONSE}"
            exit 1
          fi
          echo "✓ Backend health check passed"

      - name: Smoke test frontend availability
        if: ${{ inputs.deploy_frontend }}
        shell: bash
        run: |
          echo "Waiting for frontend revision to warm up..."
          sleep 20
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.summary.outputs.frontend_url }}/" || echo "000")
          if [ "${RESPONSE}" != "200" ]; then
            echo "Frontend health check failed with status ${RESPONSE}"
            exit 1
          fi
          echo "✓ Frontend health check passed"

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "### Manual ACA deployment"
            echo
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Ref | \`${{ inputs.git_ref }}\` |"
            echo "| Commit tag | \`${{ steps.meta.outputs.sha_short }}\` |"
            echo "| Registry | \`${{ env.REGISTRY_SERVER }}\` |"
            echo "| Backend image | \`${{ steps.meta.outputs.backend_image }}\` |"
            echo "| Frontend image | \`${{ steps.meta.outputs.frontend_image }}\` |"
            echo "| Backend URL | ${{ steps.summary.outputs.backend_url }} |"
            echo "| Frontend URL | ${{ steps.summary.outputs.frontend_url }} |"
          } >> "$GITHUB_STEP_SUMMARY"
