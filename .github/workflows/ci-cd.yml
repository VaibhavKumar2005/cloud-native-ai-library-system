name: VeriRAG CI/CD → ACR → ACA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  # Azure Container Registry (your production setup)
  ACR_REGISTRY: acrvaibhavrag2026.azurecr.io
  ACR_REPOSITORY: verirag
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_TAG_SHORT: ${{ github.sha }}
  
  # Azure Environment (from repository variables)
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: eastus

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  # ============================================================================
  # STAGE 1: CONTINUOUS INTEGRATION
  # Test backend & frontend code
  # ============================================================================
  ci:
    name: Test & Validate
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: verirag_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d verirag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend Testing
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Run Django checks
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'False'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
        run: python manage.py check --deploy

      - name: Run backend tests
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'True'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
        run: |
          pip install pytest pytest-django pytest-cov
          pytest tests/ --cov=ai_engine --cov-report=term-summary || true

      # Frontend Testing
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci --no-audit

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Lint frontend
        working-directory: apps/frontend
        run: npm run lint || true


  # ============================================================================
  # STAGE 2: SECURITY SCANNING
  # Trivy vulnerability & dependency scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy scan backend dependencies
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend/requirements.txt'
          format: 'sarif'
          output: 'trivy-backend-deps.sarif'
        continue-on-error: true

      - name: Trivy scan frontend dependencies
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/frontend/package.json'
          format: 'sarif'
          output: 'trivy-frontend-deps.sarif'
        continue-on-error: true

      - name: Upload security results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-*.sarif'
        continue-on-error: true


  # ============================================================================
  # STAGE 3: BUILD & PUSH TO ACR
  # Build Docker images and push to Azure Container Registry
  # ============================================================================
  build-push-acr:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: [ci, security]
    
    outputs:
      backend-image: ${{ steps.build-backend-output.outputs.image }}
      frontend-image: ${{ steps.build-frontend-output.outputs.image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure Login via OIDC Workload Identity
      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Get ACR credentials (passwordless via managed identity)
      - name: Get ACR credentials
        id: acr-creds
        run: |
          ACR_NAME="${ACR_REGISTRY%.azurecr.io}"
          ACR_USERNAME=$(az acr credential show --name "$ACR_NAME" --query 'username' -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)
          
          echo "::add-mask::$ACR_PASSWORD"
          echo "username=$ACR_USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$ACR_PASSWORD" >> "$GITHUB_OUTPUT"

      # Docker login to ACR
      - name: Docker login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ steps.acr-creds.outputs.username }}
          password: ${{ steps.acr-creds.outputs.password }}

      # Set up buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push backend image
      - name: Build & push backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:${{ env.IMAGE_TAG_SHORT }}
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:buildcache,mode=max

      - name: Set backend image output
        id: build-backend-output
        run: echo "image=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:${{ env.IMAGE_TAG_SHORT }}" >> "$GITHUB_OUTPUT"

      # Build and push frontend image
      - name: Build & push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:${{ env.IMAGE_TAG_SHORT }}
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:buildcache,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}

      - name: Set frontend image output
        id: build-frontend-output
        run: echo "image=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:${{ env.IMAGE_TAG_SHORT }}" >> "$GITHUB_OUTPUT"

      - name: Image summary
        run: |
          echo "✅ Backend push:  ${{ steps.build-backend-output.outputs.image }}"
          echo "✅ Frontend push: ${{ steps.build-frontend-output.outputs.image }}"


  # ============================================================================
  # STAGE 4: DEPLOY TO AZURE CONTAINER APPS
  # Update running container apps with new image tags
  # ============================================================================
  deploy-aca:
    name: Deploy to ACA
    runs-on: ubuntu-latest
    needs: build-push-acr
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure Login via OIDC Workload Identity
      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Deploy backend
      - name: Deploy backend to ACA
        run: |
          echo "🚀 Deploying backend..."
          az containerapp update \
            --name ${{ vars.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ needs.build-push-acr.outputs.backend-image }} \
            --output json | jq '.id'
          echo "✅ Backend deployment triggered"

      # Deploy Celery worker
      - name: Deploy Celery worker to ACA
        run: |
          echo "🚀 Deploying Celery worker..."
          az containerapp update \
            --name ${{ vars.CELERY_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ needs.build-push-acr.outputs.backend-image }} \
            --output json | jq '.id'
          echo "✅ Celery worker deployment triggered"

      # Deploy frontend
      - name: Deploy frontend to ACA
        run: |
          echo "🚀 Deploying frontend..."
          az containerapp update \
            --name ${{ vars.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ needs.build-push-acr.outputs.frontend-image }} \
            --output json | jq '.id'
          echo "✅ Frontend deployment triggered"

      # Wait for stabilization
      - name: Wait for deployments
        run: sleep 45

      # Health checks
      - name: Health check - Backend
        id: backend-check
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name ${{ vars.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv)
          echo "backend_fqdn=$BACKEND_FQDN" >> "$GITHUB_OUTPUT"
          
          echo "🔍 Checking backend health..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$BACKEND_FQDN/api/health/" || echo "000")
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Backend healthy (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Backend returned HTTP $HTTP_CODE (may need warmup)"
          fi

      - name: Health check - Frontend
        id: frontend-check
        run: |
          FRONTEND_FQDN=$(az containerapp show \
            --name ${{ vars.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv)
          echo "frontend_fqdn=$FRONTEND_FQDN" >> "$GITHUB_OUTPUT"
          
          echo "🔍 Checking frontend health..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$FRONTEND_FQDN/" || echo "000")
          
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 304 ]; then
            echo "✅ Frontend healthy (HTTP $HTTP_CODE)"
          else
            echo "⚠️ Frontend returned HTTP $HTTP_CODE (may need warmup)"
          fi

      # Post summary
      - name: Deployment summary
        run: |
          {
            echo "## 🚀 VeriRAG Deployment Complete"
            echo ""
            echo "| Component | Status | URL |"
            echo "|-----------|--------|-----|"
            echo "| Backend | ✅ Deployed | https://${{ steps.backend-check.outputs.backend_fqdn }} |"
            echo "| Celery | ✅ Deployed | (internal) |"
            echo "| Frontend | ✅ Deployed | https://${{ steps.frontend-check.outputs.frontend_fqdn }} |"
            echo ""
            echo "### Image Tags"
            echo "- Backend: \`${{ needs.build-push-acr.outputs.backend-image }}\`"
            echo "- Frontend: \`${{ needs.build-push-acr.outputs.frontend-image }}\`"
            echo ""
            echo "### Region"
            echo "- Location: \`${{ env.LOCATION }}\` (East US)"
            echo "- Resource Group: \`${{ env.AZURE_RESOURCE_GROUP }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

