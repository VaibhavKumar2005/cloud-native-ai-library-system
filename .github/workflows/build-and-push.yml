name: Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:
    inputs:
      frontend_demo_mode:
        description: 'Build frontend with VITE_DEMO_MODE=true'
        required: false
        default: 'false'
      frontend_api_url:
        description: 'Frontend API base URL (e.g. https://<backend-fqdn>)'
        required: false
        default: 'https://ca-verirag-dev-backend.ashyriver-f016f32f.westus2.azurecontainerapps.io'

env:
  ACR_NAME: ${{ vars.ACR_NAME || 'acrvaibhavrag2026' }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'acrvaibhavrag2026.azurecr.io' }}
  ACA_ENV_NAME: ${{ vars.ACA_ENV_NAME || 'verirag-env' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'centralindia' }}
  BACKEND_TARGET_PORT: ${{ vars.BACKEND_TARGET_PORT || '8000' }}
  FRONTEND_TARGET_PORT: ${{ vars.FRONTEND_TARGET_PORT || '8080' }}
  BACKEND_CPU: ${{ vars.BACKEND_CPU || '0.5' }}
  BACKEND_MEMORY: ${{ vars.BACKEND_MEMORY || '1.0Gi' }}
  FRONTEND_CPU: ${{ vars.FRONTEND_CPU || '0.5' }}
  FRONTEND_MEMORY: ${{ vars.FRONTEND_MEMORY || '1.0Gi' }}
  DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'development' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/verirag-backend:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/verirag-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            VITE_DEMO_MODE=${{ github.event.inputs.frontend_demo_mode || 'false' }}
            VITE_API_URL=${{ github.event.inputs.frontend_api_url || vars.VITE_API_URL || 'https://ca-verirag-dev-backend.ashyriver-f016f32f.westus2.azurecontainerapps.io' }}
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/verirag-frontend:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/verirag-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-container-apps:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required deployment variables
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ vars.AZURE_RESOURCE_GROUP }}" ]] || { echo "Missing repo variable: AZURE_RESOURCE_GROUP"; exit 1; }
          [[ -n "${{ vars.BACKEND_APP_NAME }}" ]] || { echo "Missing repo variable: BACKEND_APP_NAME"; exit 1; }
          [[ -n "${{ vars.FRONTEND_APP_NAME }}" ]] || { echo "Missing repo variable: FRONTEND_APP_NAME"; exit 1; }
          [[ -n "${{ secrets.DJANGO_SECRET_KEY }}" ]] || { echo "Missing repo secret: DJANGO_SECRET_KEY"; exit 1; }
          [[ -n "${{ secrets.POSTGRES_HOST }}" ]] || { echo "Missing repo secret: POSTGRES_HOST"; exit 1; }
          [[ -n "${{ secrets.POSTGRES_DB }}" ]] || { echo "Missing repo secret: POSTGRES_DB"; exit 1; }
          [[ -n "${{ secrets.POSTGRES_USER }}" ]] || { echo "Missing repo secret: POSTGRES_USER"; exit 1; }
          [[ -n "${{ secrets.POSTGRES_PASSWORD }}" ]] || { echo "Missing repo secret: POSTGRES_PASSWORD"; exit 1; }
          [[ -n "${{ secrets.REDIS_URL }}" ]] || { echo "Missing repo secret: REDIS_URL"; exit 1; }
          [[ -n "${{ secrets.AZURE_OPENAI_ENDPOINT }}" ]] || { echo "Missing repo secret: AZURE_OPENAI_ENDPOINT"; exit 1; }
          [[ -n "${{ secrets.AZURE_OPENAI_API_KEY }}" ]] || { echo "Missing repo secret: AZURE_OPENAI_API_KEY"; exit 1; }
          [[ -n "${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}" ]] || { echo "Missing repo secret: AZURE_OPENAI_DEPLOYMENT_NAME"; exit 1; }

      - name: Ensure ACA environment exists
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          ENV_NAME="${{ env.ACA_ENV_NAME }}"

          if az containerapp env show --name "$ENV_NAME" --resource-group "$RG" >/dev/null 2>&1; then
            echo "ACA environment exists: $ENV_NAME"
          else
            echo "Creating ACA environment: $ENV_NAME in $RG"
            az containerapp env create \
              --name "$ENV_NAME" \
              --resource-group "$RG" \
              --location "${{ env.AZURE_LOCATION }}"
          fi

      - name: Get ACR admin credentials
        id: acr-creds
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="$(az acr credential show --name '${{ env.ACR_NAME }}' --query 'username' -o tsv)"
          PASSWORD="$(az acr credential show --name '${{ env.ACR_NAME }}' --query 'passwords[0].value' -o tsv)"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Deploy backend image (create or update)
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ vars.BACKEND_APP_NAME }}"
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/verirag-backend:${{ github.sha }}"

          if az containerapp show --name "$APP" --resource-group "$RG" >/dev/null 2>&1; then
            STATE="$(az containerapp show --name "$APP" --resource-group "$RG" --query 'properties.provisioningState' -o tsv || true)"
            if [[ "$STATE" == "Failed" ]]; then
              echo "Container app $APP is in Failed state. Recreating..."
              az containerapp delete --name "$APP" --resource-group "$RG" --yes
              az containerapp create \
                --name "$APP" \
                --resource-group "$RG" \
                --environment "${{ env.ACA_ENV_NAME }}" \
                --image "$IMAGE" \
                --target-port "${{ env.BACKEND_TARGET_PORT }}" \
                --cpu "${{ env.BACKEND_CPU }}" \
                --memory "${{ env.BACKEND_MEMORY }}" \
                --ingress external \
                --registry-server "${{ env.ACR_LOGIN_SERVER }}" \
                --registry-username "${{ steps.acr-creds.outputs.username }}" \
                --registry-password "${{ steps.acr-creds.outputs.password }}"
              exit 0
            fi
            az containerapp registry set \
              --name "$APP" \
              --resource-group "$RG" \
              --server "${{ env.ACR_LOGIN_SERVER }}" \
              --username "${{ steps.acr-creds.outputs.username }}" \
              --password "${{ steps.acr-creds.outputs.password }}"
            az containerapp update \
              --name "$APP" \
              --resource-group "$RG" \
              --image "$IMAGE" \
              --min-replicas 1 \
              --set-env-vars \
                ENVIRONMENT="${{ env.DEPLOY_ENVIRONMENT }}" \
                DEPLOY_MODE=cloud \
                DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
                POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}" \
                POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
                POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
                POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
                REDIS_URL="${{ secrets.REDIS_URL }}" \
                AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
                AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" \
                AZURE_OPENAI_DEPLOYMENT_NAME="${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}"
          else
            az containerapp create \
              --name "$APP" \
              --resource-group "$RG" \
              --environment "${{ env.ACA_ENV_NAME }}" \
              --image "$IMAGE" \
              --target-port "${{ env.BACKEND_TARGET_PORT }}" \
              --cpu "${{ env.BACKEND_CPU }}" \
              --memory "${{ env.BACKEND_MEMORY }}" \
              --min-replicas 1 \
              --ingress external \
              --env-vars \
                ENVIRONMENT="${{ env.DEPLOY_ENVIRONMENT }}" \
                DEPLOY_MODE=cloud \
                DJANGO_SECRET_KEY="${{ secrets.DJANGO_SECRET_KEY }}" \
                POSTGRES_HOST="${{ secrets.POSTGRES_HOST }}" \
                POSTGRES_DB="${{ secrets.POSTGRES_DB }}" \
                POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
                POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
                REDIS_URL="${{ secrets.REDIS_URL }}" \
                AZURE_OPENAI_ENDPOINT="${{ secrets.AZURE_OPENAI_ENDPOINT }}" \
                AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" \
                AZURE_OPENAI_DEPLOYMENT_NAME="${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}" \
              --registry-server "${{ env.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ steps.acr-creds.outputs.username }}" \
              --registry-password "${{ steps.acr-creds.outputs.password }}"
          fi

      - name: Deploy frontend image (create or update)
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ vars.FRONTEND_APP_NAME }}"
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/verirag-frontend:${{ github.sha }}"

          if az containerapp show --name "$APP" --resource-group "$RG" >/dev/null 2>&1; then
            STATE="$(az containerapp show --name "$APP" --resource-group "$RG" --query 'properties.provisioningState' -o tsv || true)"
            if [[ "$STATE" == "Failed" ]]; then
              echo "Container app $APP is in Failed state. Recreating..."
              az containerapp delete --name "$APP" --resource-group "$RG" --yes
              az containerapp create \
                --name "$APP" \
                --resource-group "$RG" \
                --environment "${{ env.ACA_ENV_NAME }}" \
                --image "$IMAGE" \
                --target-port "${{ env.FRONTEND_TARGET_PORT }}" \
                --cpu "${{ env.FRONTEND_CPU }}" \
                --memory "${{ env.FRONTEND_MEMORY }}" \
                --ingress external \
                --registry-server "${{ env.ACR_LOGIN_SERVER }}" \
                --registry-username "${{ steps.acr-creds.outputs.username }}" \
                --registry-password "${{ steps.acr-creds.outputs.password }}"
              exit 0
            fi
            az containerapp registry set \
              --name "$APP" \
              --resource-group "$RG" \
              --server "${{ env.ACR_LOGIN_SERVER }}" \
              --username "${{ steps.acr-creds.outputs.username }}" \
              --password "${{ steps.acr-creds.outputs.password }}"
            az containerapp update --name "$APP" --resource-group "$RG" --image "$IMAGE"
          else
            az containerapp create \
              --name "$APP" \
              --resource-group "$RG" \
              --environment "${{ env.ACA_ENV_NAME }}" \
              --image "$IMAGE" \
              --target-port "${{ env.FRONTEND_TARGET_PORT }}" \
              --cpu "${{ env.FRONTEND_CPU }}" \
              --memory "${{ env.FRONTEND_MEMORY }}" \
              --ingress external \
              --registry-server "${{ env.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ steps.acr-creds.outputs.username }}" \
              --registry-password "${{ steps.acr-creds.outputs.password }}"
          fi

      - name: Verify backend revision
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ vars.BACKEND_APP_NAME }}"
          FQDN=$(az containerapp show \
            --resource-group "$RG" \
            --name "$APP" \
            --query "properties.latestRevisionFqdn" -o tsv)

          LATEST_REV="$(az containerapp show --resource-group "$RG" --name "$APP" --query 'properties.latestRevisionName' -o tsv || true)"
          READY_REV="$(az containerapp show --resource-group "$RG" --name "$APP" --query 'properties.latestReadyRevisionName' -o tsv || true)"
          echo "Latest revision: ${LATEST_REV}"
          echo "Latest ready revision: ${READY_REV}"

          echo "Checking backend health endpoints at https://${FQDN} ..."
          if ! (
            curl --fail --retry 3 --retry-delay 8 --retry-all-errors --connect-timeout 8 --max-time 20 "https://${FQDN}/api/health/" ||
            curl --fail --retry 3 --retry-delay 8 --retry-all-errors --connect-timeout 8 --max-time 20 "https://${FQDN}/api/health"
          ); then
            echo "Backend health check failed. Fetching revision summary and recent logs..."
            az containerapp revision list \
              --resource-group "$RG" \
              --name "$APP" \
              --query "[].{name:name,active:properties.active,created:properties.createdTime,runningState:properties.runningState,healthState:properties.healthState,provisioningState:properties.provisioningState}" \
              -o table || true
            az containerapp logs show \
              --resource-group "$RG" \
              --name "$APP" \
              --type system \
              --tail 100 || true
            az containerapp logs show \
              --resource-group "$RG" \
              --name "$APP" \
              --tail 100 || true
            exit 1
          fi
