name: VeriRAG CI/CD → ACR → ACA (Improved)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  # Azure Container Registry (your production setup)
  ACR_REGISTRY: acrvaibhavrag2026.azurecr.io
  ACR_REPOSITORY: verirag
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_TAG_SHORT: ${{ github.sha }}
  
  # Azure Environment (from repository variables)
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  LOCATION: eastus
  
  # Node.js 24 compatibility (required by June 2, 2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write
  security-events: write
  checks: write  # For test reporting
  actions: read  # For workflow status

jobs:
  # ============================================================================
  # STAGE 0: VALIDATION
  # Ensure environment is properly configured
  # ============================================================================
  validate-environment:
    name: Validate Environment
    runs-on: ubuntu-latest
    
    steps:
      - name: Check required variables
        run: |
          MISSING_VARS=()
          
          [[ -z "${{ env.AZURE_CLIENT_ID }}" ]] && MISSING_VARS+=("AZURE_CLIENT_ID")
          [[ -z "${{ env.AZURE_TENANT_ID }}" ]] && MISSING_VARS+=("AZURE_TENANT_ID")
          [[ -z "${{ env.AZURE_SUBSCRIPTION_ID }}" ]] && MISSING_VARS+=("AZURE_SUBSCRIPTION_ID")
          [[ -z "${{ env.AZURE_RESOURCE_GROUP }}" ]] && MISSING_VARS+=("AZURE_RESOURCE_GROUP")
          [[ -z "${{ vars.BACKEND_APP_NAME }}" ]] && MISSING_VARS+=("BACKEND_APP_NAME")
          [[ -z "${{ vars.CELERY_APP_NAME }}" ]] && MISSING_VARS+=("CELERY_APP_NAME")
          [[ -z "${{ vars.FRONTEND_APP_NAME }}" ]] && MISSING_VARS+=("FRONTEND_APP_NAME")
          
          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo "❌ Missing required variables:"
            printf '  - %s\n' "${MISSING_VARS[@]}"
            exit 1
          fi
          
          echo "✅ All required variables are configured"

  # ============================================================================
  # STAGE 1: CONTINUOUS INTEGRATION
  # Test backend & frontend code
  # ============================================================================
  ci:
    name: Test & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate-environment
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: verirag_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d verirag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Backend Testing
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Run Django checks
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DEBUG: 'False'
          ALLOWED_HOSTS: 'localhost,127.0.0.1,0.0.0.0,backend,rag-backend'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
        run: python manage.py check --deploy

      - name: Run database migrations
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DEBUG: 'False'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
        run: python manage.py migrate --no-input

      - name: Run backend tests
        id: backend-tests
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key-not-for-production
          DEBUG: 'True'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
        run: |
          pip install pytest pytest-django pytest-cov
          pytest tests/ \
            --cov=ai_engine \
            --cov=librarian \
            --cov=verifier \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-summary \
            --junitxml=junit.xml \
            -v

      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: apps/backend/junit.xml
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/backend/htmlcov/
          retention-days: 30

      # Frontend Testing
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci --no-audit

      - name: Build frontend
        working-directory: apps/frontend
        run: npm run build

      - name: Run frontend linter
        working-directory: apps/frontend
        id: frontend-lint
        continue-on-error: true
        run: npm run lint

      - name: Lint summary
        if: steps.frontend-lint.outcome == 'failure'
        run: |
          echo "⚠️ Frontend linting found issues (non-blocking)"
          echo "Run 'npm run lint' locally to see details"

      - name: Run frontend tests (if available)
        working-directory: apps/frontend
        continue-on-error: true
        run: npm test || echo "No tests configured"

      - name: Report CI status
        if: always()
        run: |
          {
            echo "## ✅ CI Results"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Django checks | ✅ Pass |"
            echo "| Database migrations | ✅ Pass |"
            echo "| Backend tests | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |"
            echo "| Frontend build | ✅ Pass |"
            echo "| Frontend lint | ${{ steps.frontend-lint.outcome == 'success' && '✅ Pass' || '⚠️ Warnings' }} |"
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================================
  # STAGE 2: SECURITY SCANNING
  # Trivy vulnerability & dependency scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: ci
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy scan backend dependencies
        id: trivy-backend
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend/requirements.txt'
          format: 'sarif'
          output: 'trivy-backend-deps.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Trivy scan frontend dependencies
        id: trivy-frontend
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/frontend/package.json'
          format: 'sarif'
          output: 'trivy-frontend-deps.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload backend security results
        if: always() && hashFiles('trivy-backend-deps.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend-deps.sarif
          category: trivy-backend-dependencies
          wait-for-processing: false

      - name: Upload frontend security results
        if: always() && hashFiles('trivy-frontend-deps.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend-deps.sarif
          category: trivy-frontend-dependencies
          wait-for-processing: false

      - name: Store SARIF reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: trivy-*.sarif
          retention-days: 90

      - name: Security summary
        if: always()
        run: |
          {
            echo "## 🔒 Security Scan Results"
            echo ""
            echo "Vulnerabilities found in dependencies. Review in:"
            echo "- [Backend Dependencies](../../security/code-scanning?query=trivy-backend)"
            echo "- [Frontend Dependencies](../../security/code-scanning?query=trivy-frontend)"
          } >> "$GITHUB_STEP_SUMMARY"


  # ============================================================================
  # STAGE 3: BUILD & PUSH TO ACR
  # Build Docker images and push to Azure Container Registry
  # ============================================================================
  build-push-acr:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ci, security]
    if: github.ref == 'refs/heads/main'  # Only on main branch
    
    outputs:
      backend-image: ${{ steps.build-backend-output.outputs.image }}
      frontend-image: ${{ steps.build-frontend-output.outputs.image }}
      commit-sha: ${{ github.sha }}
      commit-ref: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure Login via OIDC Workload Identity
      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Get ACR credentials (passwordless via managed identity)
      - name: Get ACR credentials
        id: acr-creds
        run: |
          ACR_NAME="${ACR_REGISTRY%.azurecr.io}"
          echo "🔐 Authenticating to $ACR_NAME..."
          
          ACR_USERNAME=$(az acr credential show --name "$ACR_NAME" --query 'username' -o tsv)
          ACR_PASSWORD=$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)
          
          if [[ -z "$ACR_USERNAME" ]] || [[ -z "$ACR_PASSWORD" ]]; then
            echo "❌ Failed to retrieve ACR credentials"
            exit 1
          fi
          
          echo "::add-mask::$ACR_PASSWORD"
          echo "username=$ACR_USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$ACR_PASSWORD" >> "$GITHUB_OUTPUT"
          echo "✅ ACR credentials retrieved"

      # Docker login to ACR
      - name: Docker login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ steps.acr-creds.outputs.username }}
          password: ${{ steps.acr-creds.outputs.password }}

      # Set up buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and push backend image
      - name: Build & push backend image
        id: build-backend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:${{ env.IMAGE_TAG_SHORT }}
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:buildcache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:buildcache,mode=max

      - name: Set backend image output
        id: build-backend-output
        run: |
          BACKEND_IMAGE="${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/backend:${{ env.IMAGE_TAG_SHORT }}"
          echo "image=$BACKEND_IMAGE" >> "$GITHUB_OUTPUT"
          echo "✅ Backend image: $BACKEND_IMAGE"

      # Build and push frontend image
      - name: Build & push frontend image
        id: build-frontend
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:${{ env.IMAGE_TAG_SHORT }}
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:buildcache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:buildcache,mode=max
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'http://localhost:8000' }}

      - name: Set frontend image output
        id: build-frontend-output
        run: |
          FRONTEND_IMAGE="${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}/frontend:${{ env.IMAGE_TAG_SHORT }}"
          echo "image=$FRONTEND_IMAGE" >> "$GITHUB_OUTPUT"
          echo "✅ Frontend image: $FRONTEND_IMAGE"

      - name: Image summary
        run: |
          echo "✅ Backend push:  ${{ steps.build-backend-output.outputs.image }}"
          echo "✅ Frontend push: ${{ steps.build-frontend-output.outputs.image }}"


  # ============================================================================
  # STAGE 4: DEPLOY TO AZURE CONTAINER APPS
  # Update running container apps with new image tags, health checks, diagnostics
  # ============================================================================
  deploy-aca:
    name: 'Stage 4: Deploy to ACA'
    runs-on: ubuntu-latest
    needs: build-push-acr
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0

      # Azure Login via OIDC Workload Identity
      - name: Azure Login (OIDC)
        uses: azure/login@a65d910e8af105d49edd4344cf8cb71c1facc550 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pre-deployment checks
        id: pre-deploy
        run: |
          echo "📋 Verifying container app prerequisites..."
          
          # Check if container apps exist
          for APP in "${{ env.BACKEND_APP_NAME }}" "${{ env.FRONTEND_APP_NAME }}" "${{ env.CELERY_APP_NAME }}"; do
            if az containerapp show --name "$APP" --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" &>/dev/null; then
              echo "✅ Found app: $APP"
            else
              echo "❌ App not found: $APP"
              exit 1
            fi
          done
          
          echo "✅ All container apps verified"

      # Deploy backend
      - name: Deploy backend to ACA
        id: deploy-backend
        run: |
          echo "🚀 Deploying backend..."
          BACKEND_IMAGE="${{ needs.build-push-acr.outputs.backend-image }}"
          echo "📦 Image: $BACKEND_IMAGE"
          
          az containerapp update \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "$BACKEND_IMAGE" \
            --output json | jq '.properties.template' > /tmp/backend-template.json
          
          BACKEND_REVISION=$(jq -r '.revision' /tmp/backend-template.json)
          echo "revision=$BACKEND_REVISION" >> "$GITHUB_OUTPUT"
          echo "✅ Backend deployment triggered (revision: $BACKEND_REVISION)"

      # Deploy Celery worker
      - name: Deploy Celery worker to ACA
        id: deploy-worker
        run: |
          echo "🚀 Deploying Celery worker..."
          WORKER_IMAGE="${{ needs.build-push-acr.outputs.backend-image }}"
          echo "📦 Image: $WORKER_IMAGE"
          
          az containerapp update \
            --name "${{ env.CELERY_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "$WORKER_IMAGE" \
            --output json | jq '.properties.template' > /tmp/worker-template.json
          
          WORKER_REVISION=$(jq -r '.revision' /tmp/worker-template.json)
          echo "revision=$WORKER_REVISION" >> "$GITHUB_OUTPUT"
          echo "✅ Worker deployment triggered (revision: $WORKER_REVISION)"

      # Deploy frontend
      - name: Deploy frontend to ACA
        id: deploy-frontend
        run: |
          echo "🚀 Deploying frontend..."
          FRONTEND_IMAGE="${{ needs.build-push-acr.outputs.frontend-image }}"
          echo "📦 Image: $FRONTEND_IMAGE"
          
          az containerapp update \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --image "$FRONTEND_IMAGE" \
            --output json | jq '.properties.template' > /tmp/frontend-template.json
          
          FRONTEND_REVISION=$(jq -r '.revision' /tmp/frontend-template.json)
          echo "revision=$FRONTEND_REVISION" >> "$GITHUB_OUTPUT"
          echo "✅ Frontend deployment triggered (revision: $FRONTEND_REVISION)"

      # Wait for stabilization
      - name: Wait for deployments to stabilize
        run: |
          echo "⏳ Allowing 45 seconds for container updates..."
          sleep 45
          echo "✅ Ready for health checks"

      # Health checks with retry logic
      - name: Health check - Backend (with retry)
        id: backend-check
        run: |
          MAX_ATTEMPTS=5
          WAIT_TIME=10
          
          BACKEND_FQDN=$(az containerapp show \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv)
          
          echo "backend_fqdn=$BACKEND_FQDN" >> "$GITHUB_OUTPUT"
          
          echo "🔍 Checking backend health at https://$BACKEND_FQDN/api/health/"
          
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$BACKEND_FQDN/api/health/" || echo "000")
            
            if [ "$HTTP_CODE" -eq 200 ]; then
              echo "✅ Backend healthy (HTTP $HTTP_CODE)"
              exit 0
            else
              echo "  Attempt $attempt/$MAX_ATTEMPTS: HTTP $HTTP_CODE"
              if [ $attempt -lt $MAX_ATTEMPTS ]; then
                sleep $WAIT_TIME
              fi
            fi
          done
          
          echo "⚠️ Backend health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Health check - Frontend (with retry)
        id: frontend-check
        run: |
          MAX_ATTEMPTS=5
          WAIT_TIME=10
          
          FRONTEND_FQDN=$(az containerapp show \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query 'properties.configuration.ingress.fqdn' \
            -o tsv)
          
          echo "frontend_fqdn=$FRONTEND_FQDN" >> "$GITHUB_OUTPUT"
          
          echo "🔍 Checking frontend health at https://$FRONTEND_FQDN/"
          
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$FRONTEND_FQDN/" || echo "000")
            
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 304 ]; then
              echo "✅ Frontend healthy (HTTP $HTTP_CODE)"
              exit 0
            else
              echo "  Attempt $attempt/$MAX_ATTEMPTS: HTTP $HTTP_CODE"
              if [ $attempt -lt $MAX_ATTEMPTS ]; then
                sleep $WAIT_TIME
              fi
            fi
          done
          
          echo "⚠️ Frontend health check failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Collect container logs on failure
        if: failure()
        run: |
          echo "📋 Collecting diagnostic logs from container apps..."
          mkdir -p /tmp/logs
          
          for APP in "${{ env.BACKEND_APP_NAME }}" "${{ env.FRONTEND_APP_NAME }}" "${{ env.CELERY_APP_NAME }}"; do
            echo "🔍 Fetching logs for $APP..."
            az containerapp logs show \
              --name "$APP" \
              --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
              --tail 100 > /tmp/logs/$APP.log 2>&1 || echo "Could not retrieve logs for $APP"
          done
          
          echo "📚 Diagnostic logs collected"

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b122d8d30394e3d # v4.5.0
        with:
          name: deployment-diagnostics
          path: /tmp/logs/
          retention-days: 7
          if-no-files-found: ignore

      # Post deployment summary
      - name: Generate deployment summary
        if: always()
        run: |
          {
            echo "## 🚀 VeriRAG Deployment Summary"
            echo ""
            echo "### Deployment Status"
            
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ **Status:** Deployment successful"
            else
              echo "❌ **Status:** Deployment failed - check logs above"
            fi
            
            echo ""
            echo "### Services"
            echo ""
            echo "#### Backend"
            echo "- **Image:** \`${{ needs.build-push-acr.outputs.backend-image }}\`"
            echo "- **Revision:** \`${{ steps.deploy-backend.outputs.revision }}\`"
            echo "- **URL:** https://${{ steps.backend-check.outputs.backend_fqdn }}"
            echo "- **Health:** See logs above"
            echo ""
            echo "#### Frontend"
            echo "- **Image:** \`${{ needs.build-push-acr.outputs.frontend-image }}\`"
            echo "- **Revision:** \`${{ steps.deploy-frontend.outputs.revision }}\`"
            echo "- **URL:** https://${{ steps.frontend-check.outputs.frontend_fqdn }}"
            echo "- **Health:** See logs above"
            echo ""
            echo "#### Celery Worker"
            echo "- **Image:** \`${{ needs.build-push-acr.outputs.backend-image }}\`"
            echo "- **Revision:** \`${{ steps.deploy-worker.outputs.revision }}\`"
            echo "- **Status:** Internal service (no public URL)"
            echo ""
            echo "### Deployment Metadata"
            echo "- **Commit:** [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Author:** @${{ github.actor }}"
            echo "- **Registry:** \`${{ env.ACR_REGISTRY }}\`"
            echo "- **Resource Group:** \`${{ env.AZURE_RESOURCE_GROUP }}\`"
            echo "- **Region:** East US"
            echo "- **Timestamp:** $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo ""
            echo "### Artifacts"
            echo "- 📊 [Deployment Diagnostics](actions/runs/${{ github.run_id }}/artifacts) - if available"
          } >> "$GITHUB_STEP_SUMMARY"
          
          echo "✅ Deployment summary generated"

