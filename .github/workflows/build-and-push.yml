name: Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

env:
  ACR_NAME: ${{ vars.ACR_NAME || 'acrvaibhavrag2026' }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER || 'acrvaibhavrag2026.azurecr.io' }}
  ACA_ENV_NAME: ${{ vars.ACA_ENV_NAME || 'verirag-env' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'centralindia' }}
  BACKEND_TARGET_PORT: ${{ vars.BACKEND_TARGET_PORT || '8000' }}
  FRONTEND_TARGET_PORT: ${{ vars.FRONTEND_TARGET_PORT || '8080' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/verirag-backend:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/verirag-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/verirag-frontend:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/verirag-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-container-apps:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate required deployment variables
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ vars.AZURE_RESOURCE_GROUP }}" ]] || { echo "Missing repo variable: AZURE_RESOURCE_GROUP"; exit 1; }
          [[ -n "${{ vars.BACKEND_APP_NAME }}" ]] || { echo "Missing repo variable: BACKEND_APP_NAME"; exit 1; }
          [[ -n "${{ vars.FRONTEND_APP_NAME }}" ]] || { echo "Missing repo variable: FRONTEND_APP_NAME"; exit 1; }

      - name: Ensure ACA environment exists
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          ENV_NAME="${{ env.ACA_ENV_NAME }}"

          if az containerapp env show --name "$ENV_NAME" --resource-group "$RG" >/dev/null 2>&1; then
            echo "ACA environment exists: $ENV_NAME"
          else
            echo "Creating ACA environment: $ENV_NAME in $RG"
            az containerapp env create \
              --name "$ENV_NAME" \
              --resource-group "$RG" \
              --location "${{ env.AZURE_LOCATION }}"
          fi

      - name: Get ACR admin credentials
        id: acr-creds
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="$(az acr credential show --name '${{ env.ACR_NAME }}' --query 'username' -o tsv)"
          PASSWORD="$(az acr credential show --name '${{ env.ACR_NAME }}' --query 'passwords[0].value' -o tsv)"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Deploy backend image (create or update)
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ vars.BACKEND_APP_NAME }}"
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/verirag-backend:${{ github.sha }}"

          if az containerapp show --name "$APP" --resource-group "$RG" >/dev/null 2>&1; then
            az containerapp update --name "$APP" --resource-group "$RG" --image "$IMAGE"
          else
            az containerapp create \
              --name "$APP" \
              --resource-group "$RG" \
              --environment "${{ env.ACA_ENV_NAME }}" \
              --image "$IMAGE" \
              --target-port "${{ env.BACKEND_TARGET_PORT }}" \
              --ingress external \
              --registry-server "${{ env.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ steps.acr-creds.outputs.username }}" \
              --registry-password "${{ steps.acr-creds.outputs.password }}"
          fi

      - name: Deploy frontend image (create or update)
        shell: bash
        run: |
          set -euo pipefail
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          APP="${{ vars.FRONTEND_APP_NAME }}"
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/verirag-frontend:${{ github.sha }}"

          if az containerapp show --name "$APP" --resource-group "$RG" >/dev/null 2>&1; then
            az containerapp update --name "$APP" --resource-group "$RG" --image "$IMAGE"
          else
            az containerapp create \
              --name "$APP" \
              --resource-group "$RG" \
              --environment "${{ env.ACA_ENV_NAME }}" \
              --image "$IMAGE" \
              --target-port "${{ env.FRONTEND_TARGET_PORT }}" \
              --ingress external \
              --registry-server "${{ env.ACR_LOGIN_SERVER }}" \
              --registry-username "${{ steps.acr-creds.outputs.username }}" \
              --registry-password "${{ steps.acr-creds.outputs.password }}"
          fi

      - name: Verify backend revision
        run: |
          FQDN=$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.BACKEND_APP_NAME }}" \
            --query "properties.latestRevisionFqdn" -o tsv)
          curl --fail --retry 12 --retry-delay 10 "https://${FQDN}/api/health/"
