{{- if .Values.keda.enabled }}
# ── KEDA ScaledObject — Celery Worker (scale-to-zero on Redis queue length) ──
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "verirag.fullname" . }}-celery-worker
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
  labels:
    {{- include "verirag.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  scaleTargetRef:
    name: {{ include "verirag.fullname" . }}-celery-worker
  pollingInterval: {{ .Values.keda.pollingInterval | default 15 }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod | default 300 }}
  minReplicaCount: {{ .Values.keda.minReplicaCount | default 0 }}
  maxReplicaCount: {{ .Values.keda.maxReplicaCount | default 5 }}
  triggers:
    - type: redis
      metadata:
        address: {{ include "verirag.redisUrl" . | quote }}
        listName: celery
        listLength: {{ .Values.keda.listLength | default "5" | quote }}
      authenticationRef:
        name: {{ include "verirag.fullname" . }}-redis-auth
---
# ── KEDA TriggerAuthentication — pulls Redis URL from the shared secret ──
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "verirag.fullname" . }}-redis-auth
  namespace: {{ .Values.global.namespace | default .Release.Namespace }}
spec:
  secretTargetRef:
    - parameter: address
      name: {{ include "verirag.fullname" . }}-secrets
      key: REDIS_URL
{{- end }}
