name: Simple Deploy to ACA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  BACKEND_APP_NAME: ${{ vars.BACKEND_APP_NAME }}
  FRONTEND_APP_NAME: ${{ vars.FRONTEND_APP_NAME }}
  CELERY_APP_NAME: ${{ vars.CELERY_APP_NAME }}

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test Code
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: verirag_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Run Django tests
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: test-key
          DEBUG: "True"
          POSTGRES_HOST: localhost
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
        run: |
          python manage.py check --deploy || true
          python manage.py migrate --no-input
          python manage.py test ai_engine.tests --verbosity=2 || true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Build frontend
        working-directory: apps/frontend
        run: |
          npm ci --no-audit
          npm run build

  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Backend
        if: env.BACKEND_APP_NAME != ''
        run: |
          az containerapp update \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --source . \
            --build-env-vars buildId=${{ github.run_id }}

      - name: Deploy Frontend
        if: env.FRONTEND_APP_NAME != ''
        run: |
          az containerapp update \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --source . \
            --build-env-vars buildId=${{ github.run_id }}

      - name: Test Backend Health
        if: env.BACKEND_APP_NAME != ''
        run: |
          FQDN=$(az containerapp show \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          
          sleep 30
          curl -f "https://${FQDN}/api/health/" || echo "⚠️ Health check warning"

      - name: Deployment Summary
        run: |
          {
            echo "## ✅ Deployment Complete"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| Backend | Deployed |"
            echo "| Frontend | Deployed |"
            echo "| Commit | ${{ github.sha }} |"
          } >> $GITHUB_STEP_SUMMARY
