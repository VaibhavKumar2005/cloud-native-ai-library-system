##############################################################################
# VeriRAG Kubernetes Services
##############################################################################

---
# ============================================================================
# 1. RAG Backend Service (ClusterIP + NodePort for external access)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: rag-backend
  namespace: verirag
  labels:
    app: rag-backend
    app.kubernetes.io/part-of: verirag
spec:
  type: ClusterIP
  selector:
    app: rag-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP

---
# ============================================================================
# 2. RAG Backend — External Access (NodePort for dev, use Ingress in prod)
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: rag-backend-external
  namespace: verirag
  labels:
    app: rag-backend
    app.kubernetes.io/part-of: verirag
spec:
  type: NodePort
  selector:
    app: rag-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30080
      protocol: TCP

---
# ============================================================================
# 3. PostgreSQL Database Service
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: rag-db
  namespace: verirag
  labels:
    app: rag-db
    app.kubernetes.io/part-of: verirag
spec:
  type: ClusterIP
  clusterIP: None   # Headless service for StatefulSet
  selector:
    app: rag-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP

---
# ============================================================================
# 4. Redis Service
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: rag-redis
  namespace: verirag
  labels:
    app: rag-redis
    app.kubernetes.io/part-of: verirag
spec:
  type: ClusterIP
  selector:
    app: rag-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

---
# ============================================================================
# 5. Vault Service
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: rag-vault
  namespace: verirag
  labels:
    app: rag-vault
    app.kubernetes.io/part-of: verirag
spec:
  type: ClusterIP
  selector:
    app: rag-vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      protocol: TCP
