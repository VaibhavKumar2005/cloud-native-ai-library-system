##############################################################################
# VeriRAG PostgreSQL StatefulSet (pgvector)
# Uses a StatefulSet for stable network identity and persistent storage.
##############################################################################
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rag-db
  namespace: verirag
  labels:
    app: rag-db
    app.kubernetes.io/part-of: verirag
    app.kubernetes.io/component: database
spec:
  serviceName: rag-db
  replicas: 1
  selector:
    matchLabels:
      app: rag-db
  template:
    metadata:
      labels:
        app: rag-db
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: verirag-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: verirag-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "verirag_db"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
                - -d
                - verirag_db
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - admin
                - -d
                - verirag_db
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
        labels:
          app: rag-db
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
