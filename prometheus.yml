#============================================================================
# VeriRAG Prometheus Configuration
# Scrape metrics from the Django backend for Grafana visualization
#============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: 'verirag'
    service: 'ai-engine'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - localhost:9093

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # ========================================================================
  # PROMETHEUS SELF-MONITORING
  # ========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s
    scrape_timeout: 10s

  # ========================================================================
  # DJANGO BACKEND - AI ENGINE METRICS
  # ========================================================================
  - job_name: 'django_backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rag-backend:8000']
        labels:
          service: 'django-backend'
          component: 'ai-engine'
    scrape_interval: 15s
    scrape_timeout: 10s
    
    # Relabel to add custom labels
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'verirag-backend'

  # ========================================================================
  # SYSTEM METRICS
  # ========================================================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'infrastructure'
          component: 'system'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ========================================================================
  # POSTGRESQL DATABASE
  # ========================================================================
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['localhost:9187']
        labels:
          service: 'postgresql'
          component: 'database'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ========================================================================
  # REDIS
  # ========================================================================
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['localhost:9121']
        labels:
          service: 'redis'
          component: 'cache'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ========================================================================
  # CUSTOM APPLICATION METRICS
  # ========================================================================
  # Cost tracking metrics from CostOps
  - job_name: 'verirag-costops'
    scheme: 'http'
    static_configs:
      - targets: ['rag-backend:8000']
        labels:
          service: 'costops'
          category: 'operations'
    metrics_path: '/metrics/'
    scrape_interval: 60s
    scrape_timeout: 10s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'cost_ops_.*'
        action: keep

  # Quality metrics from QualityOps
  - job_name: 'verirag-qualityops'
    scheme: 'http'
    static_configs:
      - targets: ['rag-backend:8000']
        labels:
          service: 'qualityops'
          category: 'operations'
    metrics_path: '/metrics/'
    scrape_interval: 60s
    scrape_timeout: 10s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'quality_ops_.*'
        action: keep

  # Drift detection metrics from DriftOps
  - job_name: 'verirag-driftops'
    scheme: 'http'
    static_configs:
      - targets: ['rag-backend:8000']
        labels:
          service: 'driftops'
          category: 'operations'
    metrics_path: '/metrics/'
    scrape_interval: 60s
    scrape_timeout: 10s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'drift_ops_.*'
        action: keep

  # RAG Query performance metrics
  - job_name: 'verirag-rag'
    scheme: 'http'
    static_configs:
      - targets: ['rag-backend:8000']
        labels:
          service: 'rag-engine'
          component: 'query-pipeline'
    metrics_path: '/metrics/'
    scrape_interval: 15s
    scrape_timeout: 10s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'rag_.*|query_.*'
        action: keep