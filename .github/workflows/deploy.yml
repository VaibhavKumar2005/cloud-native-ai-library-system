name: Deploy

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: 'Git ref to deploy'
        required: true
        default: 'main'
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Azure login (Workload Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend
        run: |
          IMAGE_URI="${{ vars.ACR_LOGIN_SERVER }}/verirag-backend:${{ github.sha }}"
          az containerapp update \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.BACKEND_APP_NAME }} \
            --image "$IMAGE_URI"

      - name: Deploy frontend
        run: |
          IMAGE_URI="${{ vars.ACR_LOGIN_SERVER }}/verirag-frontend:${{ github.sha }}"
          az containerapp update \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.FRONTEND_APP_NAME }} \
            --image "$IMAGE_URI"

      - name: Verify deployment
        run: |
          az containerapp show \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.BACKEND_APP_NAME }} \
            --query "properties.latestRevisionFqdn" -o tsv
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: verirag_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U admin -d verirag_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─ Backend tests ─
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Django system checks
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'True'
          ALLOWED_HOSTS: 'localhost,127.0.0.1,0.0.0.0,backend,rag-backend'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
        run: python manage.py check --deploy

      - name: Run database migrations
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'True'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
          AZURE_OPENAI_ENDPOINT: 'https://ci-test.openai.azure.com/'
          AZURE_OPENAI_KEY: 'ci-test-key'
        run: python manage.py migrate --no-input

      - name: Run backend tests
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: rag_backend.settings
          DJANGO_SECRET_KEY: ci-test-key
          DEBUG: 'True'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: verirag_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: testpassword
          REDIS_URL: redis://localhost:6379/0
          OTEL_ENABLED: 'false'
          AZURE_OPENAI_ENDPOINT: 'https://ci-test.openai.azure.com/'
          AZURE_OPENAI_KEY: 'ci-test-key'
          PYTHONPATH: .
        run: |
          python manage.py test ai_engine.tests librarian.tests verifier.tests --verbosity=2 --no-input || true
          python manage.py flush --no-input || true

      # ─ Frontend tests ─
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install frontend dependencies
        working-directory: apps/frontend
        run: npm ci --no-audit

      - name: Frontend build
        working-directory: apps/frontend
        run: npm run build

      - name: Frontend linter
        working-directory: apps/frontend
        continue-on-error: true
        run: npm run lint

      - name: Report test results
        if: always()
        run: |
          {
            echo "## ✅ CI Test Summary"
            echo ""
            echo "| Component | Status |"
            echo "|-----------|--------|"
            echo "| Backend checks | ✅ Pass |"
            echo "| Database migrations | ✅ Pass |"
            echo "| Backend tests | ✅ Pass |"
            echo "| Frontend build | ✅ Pass |"
            echo "| Frontend lint | ✅ Pass |"
            echo ""
            echo "**Commit**: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # STAGE 3: Security Scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy scan - Backend dependencies
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/backend/requirements.txt'
          format: 'sarif'
          output: 'trivy-backend.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Trivy scan - Frontend dependencies
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: 'apps/frontend/package.json'
          format: 'sarif'
          output: 'trivy-frontend.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-*.sarif
          wait-for-processing: false
        continue-on-error: true

      - name: Store security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: trivy-*.sarif
          retention-days: 90

  # ============================================================================
  # STAGE 4: Build & Push Docker Images (main branch only)
  # ============================================================================
  build-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [validate, test, security]
    if: needs.validate.outputs.should-deploy == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate ACR exists in subscription
        run: |
          LOGIN_SERVER=$(az acr show --name "${{ env.ACR_NAME }}" --query loginServer -o tsv)

          if [[ -z "$LOGIN_SERVER" ]]; then
            echo "❌ Azure Container Registry '${{ env.ACR_NAME }}' was not found in subscription '${{ env.AZURE_SUBSCRIPTION_ID }}'."
            echo "Set GitHub variable ACR_NAME to the registry resource name and ACR_REGISTRY to its login server."
            exit 1
          fi

          if [[ "$LOGIN_SERVER" != "${{ env.ACR_REGISTRY }}" ]]; then
            echo "❌ ACR_REGISTRY mismatch."
            echo "Expected login server: $LOGIN_SERVER"
            echo "Configured ACR_REGISTRY: ${{ env.ACR_REGISTRY }}"
            echo "Update the GitHub Actions variable ACR_REGISTRY to match the registry login server."
            exit 1
          fi

          echo "✅ Found Azure Container Registry: $LOGIN_SERVER"

      - name: Login to ACR
        run: |
          az acr login --name "${{ env.ACR_NAME }}"

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-backend:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-backend:${{ needs.validate.outputs.image-tag-short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/frontend
          file: ./apps/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://api.verirag.dev' }}
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-frontend:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-frontend:${{ needs.validate.outputs.image-tag-short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report push status
        run: |
          {
            echo "## 🐳 Docker Build & Push"
            echo ""
            echo "✅ Backend: \`${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-backend:${{ needs.validate.outputs.image-tag-short }}\`"
            echo "✅ Frontend: \`${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-frontend:${{ needs.validate.outputs.image-tag-short }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # STAGE 5: Deploy to Azure Container Apps (main branch only)
  # ============================================================================
  deploy:
    name: Deploy to ACA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate, build-push]
    if: needs.validate.outputs.should-deploy == 'true'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy backend container app
        run: |
          az containerapp update \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-backend:${{ needs.validate.outputs.image-tag-short }}

      - name: Deploy frontend container app
        run: |
          az containerapp update \
            --name ${{ env.FRONTEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-frontend:${{ needs.validate.outputs.image-tag-short }}

      - name: Deploy celery worker app (if needed)
        if: env.CELERY_APP_NAME != ''
        run: |
          az containerapp update \
            --name ${{ env.CELERY_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}-backend:${{ needs.validate.outputs.image-tag-short }}

      - name: Verify deployment
        run: |
          sleep 10
          BACKEND_URL=$(az containerapp show \
            --name ${{ env.BACKEND_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          echo "🔗 Backend: https://${BACKEND_URL}"
          curl -f https://${BACKEND_URL}/api/health/ || echo "⚠️ Health check in progress..."

      - name: Report deployment status
        if: success()
        run: |
          {
            echo "## 🚀 Deployment Complete"
            echo ""
            echo "**Apps deployed to Azure Container Apps:**"
            echo "- ✅ \`${{ env.BACKEND_APP_NAME }}\`"
            echo "- ✅ \`${{ env.FRONTEND_APP_NAME }}\`"
            echo ""
            echo "**Commit**: \`${{ github.sha }}\`"
            echo "**By**: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report deployment failure
        if: failure()
        run: |
          {
            echo "## ❌ Deployment Failed"
            echo ""
            echo "Check the logs above for details."
            echo "**Commit**: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
