name: Build & Push

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'Dockerfile'
      - '.github/workflows/build-and-push.yml'
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: acrvaibhavrag2026.azurecr.io

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrvaibhavrag2026

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/verirag-backend:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/verirag-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name acrvaibhavrag2026

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/verirag-frontend:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/verirag-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
