version: '3.8'

services:
  # --- CORE INFRASTRUCTURE ---
  rag-vault:
    image: vault:1.13.3
    container_name: rag-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_TOKEN:-root}"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    # FIX: Added healthcheck to prevent backend/worker startup race conditions [cite: 145, 146]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - rag-network

  rag-redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - rag-network

  rag-db:
    image: pgvector/pgvector:pg16
    container_name: rag-db
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-devpassword}"
      POSTGRES_DB: "${POSTGRES_DB:-verirag_db}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d verirag_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rag-network

  # Note: Audit v1 suggested removing MongoDB if unused to save resources [cite: 13]
  rag-mongo:
    image: mongo:6.0
    container_name: rag-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:-admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:-devpassword}"
    volumes:
      - mongo_data:/data/db
    networks:
      - rag-network

  # --- APPLICATION SERVICES ---
  rag-backend:
    build: ./backend
    container_name: rag-backend
    # FIX: Removed user: "0:0" to use non-root user from Dockerfile [cite: 195, 197]
    # FIX: Added migration step to the startup command [cite: 150]
    command: >
      sh -c 'python manage.py migrate --no-input &&
             python manage.py runserver 0.0.0.0:8000'
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=rag_backend.settings
      - DEBUG=${DEBUG:-True}
      - POSTGRES_HOST=rag-db
      - REDIS_URL=redis://rag-redis:6379/0
      - CELERY_BROKER_URL=redis://rag-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://rag-redis:6379/0
      - VAULT_ADDR=http://rag-vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
    depends_on:
      rag-db:
        condition: service_healthy
      rag-redis:
        condition: service_healthy
      # FIX: Changed to wait for healthcheck instead of just started [cite: 146]
      rag-vault:
        condition: service_healthy
    networks:
      - rag-network

  rag-celery-worker:
    build: ./backend
    container_name: rag-celery-worker
    # FIX: Removed user: "0:0" to avoid running as root [cite: 197]
    command: celery -A rag_backend worker -l info -Q celery,ingestion,monitoring,maintenance
    volumes:
      - ./backend:/app
      - media_data:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=rag_backend.settings
      - POSTGRES_HOST=rag-db
      - REDIS_URL=redis://rag-redis:6379/0
      - CELERY_BROKER_URL=redis://rag-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://rag-redis:6379/0
      - VAULT_ADDR=http://rag-vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
    depends_on:
      rag-db:
        condition: service_healthy
      rag-redis:
        condition: service_healthy
      rag-vault:
        condition: service_healthy
    networks:
      - rag-network

  rag-celery-beat:
    build: ./backend
    container_name: rag-celery-beat
    # FIX: Removed user: "0:0" to avoid running as root [cite: 197]
    command: celery -A rag_backend beat -l info
    volumes:
      - ./backend:/app
      - celerybeat_schedule:/app/schedule
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=rag_backend.settings
      - REDIS_URL=redis://rag-redis:6379/0
      - VAULT_ADDR=http://rag-vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
    depends_on:
      rag-redis:
        condition: service_healthy
      rag-vault:
        condition: service_healthy
    networks:
      - rag-network

  # FIX: Added the missing frontend service [cite: 141, 142]
  rag-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: rag-frontend
    ports:
      - "5173:8080"
    depends_on:
      - rag-backend
    networks:
      - rag-network

  # --- OBSERVABILITY STACK ---
  rag-prometheus:
    image: prom/prometheus:v2.45.0
    container_name: rag-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - rag-network

  rag-grafana:
    image: grafana/grafana:10.0.0
    container_name: rag-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - rag-prometheus
    networks:
      - rag-network

volumes:
  postgres_data:
  mongo_data:
  grafana_data:
  redis_data:
  celerybeat_schedule:
  media_data:

networks:
  rag-network:
    driver: bridge